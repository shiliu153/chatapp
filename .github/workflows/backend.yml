name: Backend (Django)

# 2026-11-12(P0 审计):**去掉 paths 过滤**。本轨与 contract / web 一起是默认分支的
# required status check;required check 必须「每次 PR 都出现」,按 paths 跳过会让 PR
# 永久 pending,或让「没有 check」被误当成绿。代价是每次 PR 多跑 5–10 分钟。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # 测试前置:MySQL 业务库 + Redis(验证码/限流/缓存都依赖它)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chatapp_dev
          MYSQL_USER: chatapp
          MYSQL_PASSWORD: chatapp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: '1'
      DB_NAME: chatapp_dev
      DB_USER: chatapp
      DB_PASSWORD: chatapp_ci
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      # 走 TLS 连接。理由:MySQL 8 的用户默认是 caching_sha2_password,在「非 TLS」
      # 连接上做完整认证需要 RSA 公钥交换,这一步在 CI 上会失败(PyMySQL 读到空包:
      # AttributeError 'NoneType' has no attribute 'is_auth_switch_request')。
      # 走 TLS 时密码直接在加密通道内发送,不依赖 RSA 交换。
      # 本地开发保持 DB_SSL_DISABLED=1(见 .env.example):省掉约 250ms/次的 TLS 握手。
      DB_SSL_DISABLED: '0'
      # Celery broker 的环境变量必须叫 BROKER_URL(不能用 CELERY_ 前缀)
      BROKER_URL: redis://127.0.0.1:6379/1
      REDIS_URL: redis://127.0.0.1:6379/0
      # IM 凭据在 CI 里是假值:测试全程 mock 掉 IM 副作用,不会真的调 imserver
      IM_SELF_URL: http://127.0.0.1:9101
      IM_SELF_WS_URL: ws://127.0.0.1:9100/im/ws
      IM_SELF_HTTP_URL: http://127.0.0.1:9101/im/api
      IM_SELF_SECRET: ci-fake-secret-32-bytes-minimum
      IM_SELF_INTERNAL_SECRET: ci-fake-internal-32-bytes-minimum
      SMS_DEV_MODE: '1'
      AUTO_APPROVE: '1'

    defaults:
      run:
        working-directory: chatapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: chatapp/requirements.lock

      # 装**锁定文件**而不是 requirements.txt 的区间:生产镜像(deploy/docker/Dockerfile)
      # 装的就是 requirements.lock,CI 若装 txt 就是在验证一组生产不会用的版本组合,
      # 「CI 绿」推不出「生产可用」。见 P0 审计(依赖锁形同虚设)。
      - name: 安装依赖(锁定文件,与生产镜像一致)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # mysqladmin ping 是「未认证探测」:容器刚起来时会先应答,但此时带认证的
      # 连接仍可能被服务器关闭(表现为 PyMySQL 的 'NoneType' has no attribute
      # 'is_auth_switch_request')。这里改成真正建立一次 Django 连接才算就绪。
      #
      # 注意:这里刻意不用 heredoc —— YAML 块标量会把定界符一起缩进,而 bash 要求
      # 定界符顶格,一旦缩进就是"heredoc 不结束"的静默坑。改用单引号包裹的 -c 字符串。
      - name: 等待 MySQL 可认证连接
        run: |
          python -c '
          import os, sys, time
          sys.path.insert(0, os.getcwd())          # python -c 不会把当前目录放进 sys.path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          os.environ.setdefault("REDIS_URL", "redis://127.0.0.1:6379/0")
          import django
          django.setup()
          from django.db import connections

          last = None
          for attempt in range(1, 31):
              try:
                  connections["default"].ensure_connection()
                  with connections["default"].cursor() as cur:
                      cur.execute("SELECT 1")
                      cur.fetchone()
                  print("MySQL 可认证连接就绪(第 %d 次尝试)" % attempt)
                  sys.exit(0)
              except Exception as exc:
                  last = exc
                  print("  第 %d 次: %s: %s" % (attempt, type(exc).__name__, exc), flush=True)
                  time.sleep(5)
          print("MySQL 在超时前始终无法建立可认证连接", file=sys.stderr)
          raise SystemExit(1) from last
          '

      # Django 测试运行器会自行 CREATE DATABASE test_<DB_NAME>,而 service container
      # 用 MYSQL_USER 建出的账号只有 MYSQL_DATABASE 一个库的权限,建库会 1044 被拒。
      # 与 chatapp/db_setup.sql 保持一致:用 root 给测试库单独授权。
      # 库名不加反引号(test_chatapp_dev 是合法标识符),免去 shell 转义问题;
      # mysql 客户端即使 SQL 失败也返回 0,所以再查一次 SHOW GRANTS 确认真的生效。
      - name: 给测试库授权
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            -e "GRANT ALL PRIVILEGES ON test_chatapp_dev.* TO 'chatapp'@'%'; FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -B \
            -e "SHOW GRANTS FOR 'chatapp'@'%'" | grep -q test_chatapp_dev \
            || { echo "测试库授权未生效" >&2; exit 1; }

      - name: 连接诊断(环境差异排查用)
        run: |
          python -c '
          import os, sys, pymysql
          sys.path.insert(0, os.getcwd())
          print("pymysql =", pymysql.__version__)
          try:
              import cryptography
              print("cryptography =", cryptography.__version__)
          except ImportError:
              print("cryptography = 缺失!")
          print("DB_SSL_DISABLED =", os.environ.get("DB_SSL_DISABLED"))
          try:
              c = pymysql.connect(
                  host=os.environ["DB_HOST"], port=int(os.environ["DB_PORT"]),
                  user=os.environ["DB_USER"], password=os.environ["DB_PASSWORD"],
                  database=os.environ["DB_NAME"], connect_timeout=10,
                  ssl_disabled=os.environ.get("DB_SSL_DISABLED") == "1",
              )
              with c.cursor() as cur:
                  cur.execute("SELECT VERSION()")
                  print("服务器版本 =", cur.fetchone()[0])
                  cur.execute("SHOW SESSION STATUS LIKE \"Ssl_cipher\"")
                  print("本次连接 TLS =", cur.fetchone()[1] or "(未加密)")
              c.close()
              print("诊断连接成功")
          except Exception as exc:
              import traceback
              traceback.print_exc()
              print("诊断连接失败:", type(exc).__name__, exc)
          '

      - name: 迁移
        run: python manage.py migrate --noinput --verbosity=2

      - name: 跑测试
        run: python manage.py test --noinput --verbosity=2

      # accounts.E001 是「生产开了固定验证码、但准入名单种子为空」的部署期门禁。
      # 它此前**从未在任何流水线里被执行过**:CI 全程 DEBUG=1(检查直接返回)、
      # migrate 不跑 system checks、一键部署脚本里也没有 manage.py check。
      # 这里用生产口径反向验证「门禁真的会响」——预期 check 非零退出且报出 E001。
      - name: 部署配置门禁自检(DEBUG=0 时 accounts.E001 必须生效)
        env:
          DEBUG: '0'
          SMS_DEV_MODE: '1'
          SMS_PHONE_WHITELIST: ''
          # DEBUG=0 会走 settings 的生产分支,而 CI 没有 .env 文件:把生产必填项补齐,
          # 否则会在更早的 ImproperlyConfigured 上失败(看起来像 E001 但其实是配置缺失)。
          IM_MEDIA_SIGN_SECRET: ci-fake-media-secret-32-bytes
          IM_MEDIA_PREFIX: http://127.0.0.1:8000/media/chat/
          MEDIA_BASE_URL: http://127.0.0.1:8000
        run: |
          set +e
          out=$(python manage.py check 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" = 0 ]; then
            echo "::error::DEBUG=0 + SMS_DEV_MODE=1 + 空白名单 时 check 竟然通过 —— accounts.E001 门禁失效"
            exit 1
          fi
          case "$out" in
            *accounts.E001*) echo "accounts.E001 已生效(门禁可达)" ;;
            *) echo "::error::check 失败了,但输出里没有 accounts.E001(可能是别的错误)"; exit 1 ;;
          esac

      # D-5:``docs/api/openapi.yml`` 是「机器可读契约」的生成物。这里重新生成一次再
      # 用 git diff 比对:任何人改了视图/序列化器却没同步生成物,CI 立刻红。
      # 注意生成物路径在仓库根(docs/),而本 job 的 working-directory 是 chatapp/。
      - name: 校验 OpenAPI 生成物与代码一致
        run: |
          python manage.py spectacular --file ../docs/api/openapi.yml --validate
          git -C .. diff --exit-code -- docs/api/openapi.yml

      # perf/ 在仓库根(不在 chatapp/ 下),所以 manage.py test 抓不到它的用例。
      # 这份自测是纯标准库 + 本地回显服务器,不依赖 MySQL/Redis,秒级跑完:
      # 它防的是「压测脚本自己错了却给出好看的数字」(头没发出去、{i} 没替换、令牌落盘)。
      - name: 压测脚本自测
        working-directory: ${{ github.workspace }}
        run: python -m unittest perf.test_run -v
