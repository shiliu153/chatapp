name: Backend (Django)

on:
  push:
    branches: [master, main]
    paths:
      - 'chatapp/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'chatapp/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # 测试前置:MySQL 业务库 + Redis(验证码/限流/缓存都依赖它)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chatapp_dev
          MYSQL_USER: chatapp
          MYSQL_PASSWORD: chatapp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: '1'
      DB_NAME: chatapp_dev
      DB_USER: chatapp
      DB_PASSWORD: chatapp_ci
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_SSL_DISABLED: '1'
      # Celery broker 的环境变量必须叫 BROKER_URL(不能用 CELERY_ 前缀)
      BROKER_URL: redis://127.0.0.1:6379/1
      REDIS_URL: redis://127.0.0.1:6379/0
      # IM 凭据在 CI 里是假值:测试全程 mock 掉 IM 副作用,不会真的调腾讯云
      IM_SDKAPPID: '1400000000'
      IM_SECRETKEY: ci-fake-key
      SMS_DEV_MODE: '1'
      AUTO_APPROVE: '1'

    defaults:
      run:
        working-directory: chatapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: chatapp/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # mysqladmin ping 是「未认证探测」:容器刚起来时会先应答,但此时带认证的
      # 连接仍可能被服务器关闭(表现为 PyMySQL 的 'NoneType' has no attribute
      # 'is_auth_switch_request')。这里改成真正建立一次 Django 连接才算就绪。
      #
      # 注意:这里刻意不用 heredoc —— YAML 块标量会把定界符一起缩进,而 bash 要求
      # 定界符顶格,一旦缩进就是"heredoc 不结束"的静默坑。改用单引号包裹的 -c 字符串。
      - name: 等待 MySQL 可认证连接
        run: |
          python -c '
          import os, sys, time
          sys.path.insert(0, os.getcwd())          # python -c 不会把当前目录放进 sys.path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          os.environ.setdefault("REDIS_URL", "redis://127.0.0.1:6379/0")
          import django
          django.setup()
          from django.db import connections

          last = None
          for attempt in range(1, 31):
              try:
                  connections["default"].ensure_connection()
                  with connections["default"].cursor() as cur:
                      cur.execute("SELECT 1")
                      cur.fetchone()
                  print("MySQL 可认证连接就绪(第 %d 次尝试)" % attempt)
                  sys.exit(0)
              except Exception as exc:
                  last = exc
                  print("  第 %d 次: %s: %s" % (attempt, type(exc).__name__, exc), flush=True)
                  time.sleep(5)
          print("MySQL 在超时前始终无法建立可认证连接", file=sys.stderr)
          raise SystemExit(1) from last
          '

      # Django 测试运行器会自行 CREATE DATABASE test_<DB_NAME>,而 service container
      # 用 MYSQL_USER 建出的账号只有 MYSQL_DATABASE 一个库的权限,建库会 1044 被拒。
      # 与 chatapp/db_setup.sql 保持一致:用 root 给测试库单独授权。
      # 库名不加反引号(test_chatapp_dev 是合法标识符),免去 shell 转义问题;
      # mysql 客户端即使 SQL 失败也返回 0,所以再查一次 SHOW GRANTS 确认真的生效。
      - name: 给测试库授权
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            -e "GRANT ALL PRIVILEGES ON test_chatapp_dev.* TO 'chatapp'@'%'; FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -B \
            -e "SHOW GRANTS FOR 'chatapp'@'%'" | grep -q test_chatapp_dev \
            || { echo "测试库授权未生效" >&2; exit 1; }

      - name: 迁移
        run: python manage.py migrate --noinput --verbosity=2

      - name: 跑测试
        run: python manage.py test --noinput --verbosity=2
