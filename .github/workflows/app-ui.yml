name: App UI (emulator smoke)

on:
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ui.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-ui.yml'
  workflow_dispatch:

# L3 第一半:把「App 跑得起来」搬进 CI。
#
# 真安卓模拟器(api-level 34)+ integration_test/smoke_test.dart。后端**故意不可达**
# (API_BASE 指到 127.0.0.1:1),所以这一轨只验「冷启动 → 登录页」这一条底线,
# 不需要真 MySQL / Redis / Django;人工验收因此从「跑得起来」降级为「好不好看」。
#
# 与 app.yml 分工:app.yml 管静态检查 + 单元/组件测试(假网络),不需要模拟器;
# 本轨只在模拟器上跑 integration_test(真 App、真插件)。
#
# 2026-11-08 加固:Gradle 依赖走缓存 + 预热带退避重试,专门防「上游 504 把这条轨
# 打成假红」。来龙去脉见下方两个 step 的注释,别把缓存/预热当成可以随手删的优化。
jobs:
  smoke:
    name: app-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # GitHub 的 Linux runner 上 /dev/kvm 默认只有 root 可读写,不放开的话模拟器
      # 只能退回软件渲染,启动慢到会撞 30 分钟超时(报错看着像测试红,其实是环境)。
      - name: 打开 KVM 硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 与 app.yml 钉同一个 Flutter 版本:两条轨若不一致,会出现「本轨红/本轨绿」的假象
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: 拉依赖
        working-directory: app
        run: flutter pub get

      # 第 2 轮 CI 暴露的坑(与本 workflow 的写法无关):`app/android/app/build.gradle.kts`
      # 在**配置阶段**就无条件读 `app/android/key.properties`(gitignored,CI 里不存在),
      # 缺了直接报 `null cannot be cast to non-null type kotlin.String`,连 assembleDebug
      # 都过不去。debug 包用不到发布签名,给一组非空的一次性值即可;keystore 现造在
      # $RUNNER_TEMP,不进仓库(`key.properties` / `*.jks` 都在 `app/android/.gitignore` 里)。
      - name: 造 CI 一次性签名配置(Gradle 配置期要求 key.properties 存在)
        working-directory: app/android
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storetype JKS -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass cipass -keypass cipass \
            -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=CN"
          {
            echo "storeFile=$RUNNER_TEMP/ci-debug.jks"
            echo "storePassword=cipass"
            echo "keyAlias=ci"
            echo "keyPassword=cipass"
          } > key.properties
          echo "已生成 app/android/key.properties(指向一次性 keystore)"

      # ── 抗上游抖动(2026-11-08 加固)────────────────────────────────────────────
      # 背景:2026-11-08 这条轨连着红了三次,根因**不是代码也不是配置**,而是
      # `kotlin-compiler-embeddable-2.2.21.jar` 从 repo.maven.apache.org 拉取时被
      # 重定向到 github.com/JetBrains/kotlin/releases 并吃到 **504 Gateway Time-out**;
      # 同一份代码 8 分钟后重跑就绿。Flutter 自带的「Retrying Gradle Build」只等 100ms,
      # 等于没有重试。而且 Flutter SDK 自带的 gradle 插件(settings.gradle.kts 只声明
      # google()+mavenCentral())绕不过我们仓库里配的阿里云镜像,只能走国际链路。
      #
      # 两道保险:
      #   ① 缓存 `~/.gradle/caches/modules-2`(下载产物)+ `~/.gradle/wrapper/dists`
      #      (gradle-9.3.1 发行包):**一次成功后 jar 就留在缓存里**,后续 run 不再重下;
      #   ② 在模拟器之外先跑一遍 debug 构建,失败退避重试 3 次 —— 抖动时在这里重试,
      #      而不是让整条轨在模拟器里红掉。
      # key 只跟「会改变依赖图」的文件走;restore-keys 保证换 key 时仍能吃到旧缓存
      # (缓存条目本身不可变,命中旧 key 时 Gradle 只会补下缺的那几个 artifact)。
      - name: 缓存 Gradle 依赖与 wrapper 发行包
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/settings.gradle.kts', 'app/android/build.gradle.kts', 'app/android/app/build.gradle.kts', 'app/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 预热:把 assembleDebug 依赖的整条链(app 的依赖图 + Flutter 自带 gradle 插件
      # 那个 includeBuild 的 Kotlin 编译器)先拉齐并落进缓存。失败退避重试 3 次。
      # 这一遍构建同时让后面模拟器里的 assembleDebug 变成增量构建。
      - name: 预热 Gradle 依赖(失败退避重试,抗上游 504)
        working-directory: app
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug --dart-define=API_BASE=http://127.0.0.1:1/api/v1; then
              echo "Gradle 预热成功(第 ${attempt} 次)"
              exit 0
            fi
            echo "::warning title=Gradle 预热失败::第 ${attempt}/3 次失败,等待 $((attempt * 30))s 后重试"
            sleep $((attempt * 30))
          done
          echo "::error title=Gradle 预热失败::连续 3 次失败 —— 按上游不可用处理,不要当代码红去查"
          exit 1

      # script 必须是**单行**:android-emulator-runner 逐行 `sh -c` 执行 script
      # (每行一个独立进程),所以续行 `\`、跨行 `set -e`、`$?`/重定向都会失效 ——
      # 第 1 轮 CI 就红在续行上(多出来的 `\` 被当成第三个测试路径,flutter 于是
      # 报「Integration tests and unit tests cannot be run in a single invocation」)。
      # `--reporter expanded` 的完整输出本身就在 job log 里,不再另外上传 artifact。
      # 两个 integration 文件放在**同一次** flutter test 调用里(路径并列),不要拆成两行
      # script —— `android-emulator-runner` 逐行起进程,拆开等于让第二条在模拟器已经
      # 被前一条占用/清理之后重跑一遍构建,白烧几分钟。
      # 两条都用 `--dart-define=API_BASE=http://127.0.0.1:1/api/v1` 把后端打死:
      # `smoke_test` 验「连不上也落在登录页」,`discovery_filter_test` 把标签池
      # override 成固定值、只验面板的**真实命中测试**(chip 选中 / 滑块拖动)。
      - name: 在模拟器上跑 integration_test(冒烟 + 筛选面板指针事件)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          working-directory: app
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/smoke_test.dart integration_test/discovery_filter_test.dart -d emulator-5554 --dart-define=API_BASE=http://127.0.0.1:1/api/v1 --reporter expanded
