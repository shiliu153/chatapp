name: App UI (emulator smoke)

on:
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ui.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-ui.yml'
  workflow_dispatch:

# L3 第一半:把「App 跑得起来」搬进 CI。
#
# 真安卓模拟器(api-level 34)+ integration_test/smoke_test.dart。后端**故意不可达**
# (API_BASE 指到 127.0.0.1:1),所以这一轨只验「冷启动 → 登录页」这一条底线,
# 不需要真 MySQL / Redis / Django;人工验收因此从「跑得起来」降级为「好不好看」。
#
# 与 app.yml 分工:app.yml 管静态检查 + 单元/组件测试(假网络),不需要模拟器;
# 本轨只在模拟器上跑 integration_test(真 App、真插件),失败时把完整日志与 logcat 落 artifact。
jobs:
  smoke:
    name: app-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # GitHub 的 Linux runner 上 /dev/kvm 默认只有 root 可读写,不放开的话模拟器
      # 只能退回软件渲染,启动慢到会撞 30 分钟超时(报错看着像测试红,其实是环境)。
      - name: 打开 KVM 硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 与 app.yml 钉同一个 Flutter 版本:两条轨若不一致,会出现「本轨红/本轨绿」的假象
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: 拉依赖
        working-directory: app
        run: flutter pub get

      - name: 在模拟器上跑冒烟 integration_test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          working-directory: app
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            # adb 供脚本末尾抓 logcat:action 不一定把它放进 PATH
            export PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platform-tools:$PATH"

            # 完整日志落文件:失败时不能只留一行 exit 1,否则事后无法判断是
            # 应用启动失败、断言不符还是模拟器/构建问题
            set +e
            flutter test integration_test/smoke_test.dart -d emulator-5554 \
              --dart-define=API_BASE=http://127.0.0.1:1/api/v1 \
              --reporter expanded > /tmp/app-ui-test.log 2>&1
            status=$?
            set -e

            # 这一步结束时模拟器就被拆了,logcat 只能现在抓
            adb logcat -d > /tmp/app-ui-logcat.txt || true

            cat /tmp/app-ui-test.log
            exit $status

      - name: 失败时上传测试日志与 logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-ui-failure-logs
          path: |
            /tmp/app-ui-test.log
            /tmp/app-ui-logcat.txt
          retention-days: 7
