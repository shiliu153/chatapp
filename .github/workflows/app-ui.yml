name: App UI (emulator smoke)

on:
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ui.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-ui.yml'
  workflow_dispatch:
    inputs:
      # W-L3:golden 基准图**只能在 CI 生成**。
      # 本机模拟器是 API 37 / sdk_gphone16k_x86_64,这条轨是 API 34 / AOSP default,
      # 系统字体与渲染都不同 —— 本机 --update-goldens 的产物不能当基准。
      # 用法:`gh workflow run app-ui.yml --ref <branch> -f update_goldens=true`,
      # 跑完下载 artifact `goldens`,把 app/integration_test/goldens/*.png 提交进分支。
      update_goldens:
        description: '只跑 golden 用例并重写基准图(产物作为 artifact 上传,不会自动提交)'
        type: boolean
        default: false

# L3:把「App 跑得起来」与「App 长什么样」都搬进 CI。
#
# 真安卓模拟器(api-level 34)+ integration_test/*.dart。后端**故意不可达**
# (API_BASE 指到 127.0.0.1:1),所以这一轨不需要真 MySQL / Redis / Django:
# 它验的是「后端连不上时 App 仍落到登录页」(smoke)以及若干**真实指针事件**的手势用例,
# 外加两张 golden(登录页 / 首页)。
#
# golden(W-L3)的机制:`integration_test` 在设备上装 `VmServiceProxyGoldenFileComparator`,
# 截到的字节经 VM service 事件发回宿主,由宿主侧的 `flutter_tester` 比对/落盘
# (`flutter_platform.dart` 的 `_listenToVmServiceForGoldens`)。所以**不需要 flutter drive**,
# `flutter test -d emulator-5554` 本身就能比对,`--update-goldens` 也在宿主侧写文件。
# 容差在 `app/integration_test/flutter_test_config.dart`(差异像素 ≤ 0.1%)。
#
# 与 app.yml 分工:app.yml 管静态检查 + 单元/组件测试(假网络),不需要模拟器;
# 本轨只在模拟器上跑 integration_test(真 App、真插件)。
#
# 2026-11-08 加固:Gradle 依赖走缓存 + 预热带退避重试,专门防「上游 504 把这条轨
# 打成假红」。来龙去脉见下方两个 step 的注释,别把缓存/预热当成可以随手删的优化。
jobs:
  smoke:
    name: app-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GitHub 的 Linux runner 上 /dev/kvm 默认只有 root 可读写,不放开的话模拟器
      # 只能退回软件渲染,启动慢到会撞 30 分钟超时(报错看着像测试红,其实是环境)。
      - name: 打开 KVM 硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 与 app.yml 钉同一个 Flutter 版本:两条轨若不一致,会出现「本轨红/本轨绿」的假象
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: 拉依赖
        working-directory: app
        run: flutter pub get

      # 这里**故意不造 key.properties / keystore**(#249 之前靠 keytool 现造一次性签名配置兜底)。
      # 本轨就是「没有 key.properties 的 checkout」:runner 上没有这个 gitignored 文件,
      # 下面的 `flutter build apk --debug` 能跑通就说明 `app/android/app/build.gradle.kts`
      # 已经不再硬依赖它(release 签名配置只在文件存在时创建,缺失时回落到 debug 签名)。
      # 别把 keytool 那一步加回来 —— 那样这条轨就再也证明不了回落生效。

      # ── 抗上游抖动(2026-11-08 加固)────────────────────────────────────────────
      # 背景:2026-11-08 这条轨连着红了三次,根因**不是代码也不是配置**,而是
      # `kotlin-compiler-embeddable-2.2.21.jar` 从 repo.maven.apache.org 拉取时被
      # 重定向到 github.com/JetBrains/kotlin/releases 并吃到 **504 Gateway Time-out**;
      # 同一份代码 8 分钟后重跑就绿。Flutter 自带的「Retrying Gradle Build」只等 100ms,
      # 等于没有重试。而且 Flutter SDK 自带的 gradle 插件(settings.gradle.kts 只声明
      # google()+mavenCentral())绕不过我们仓库里配的阿里云镜像,只能走国际链路。
      #
      # 两道保险:
      #   ① 缓存 `~/.gradle/caches/modules-2`(下载产物)+ `~/.gradle/wrapper/dists`
      #      (gradle-9.3.1 发行包):**一次成功后 jar 就留在缓存里**,后续 run 不再重下;
      #   ② 在模拟器之外先跑一遍 debug 构建,失败退避重试 3 次 —— 抖动时在这里重试,
      #      而不是让整条轨在模拟器里红掉。
      # key 只跟「会改变依赖图」的文件走;restore-keys 保证换 key 时仍能吃到旧缓存
      # (缓存条目本身不可变,命中旧 key 时 Gradle 只会补下缺的那几个 artifact)。
      - name: 缓存 Gradle 依赖与 wrapper 发行包
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/settings.gradle.kts', 'app/android/build.gradle.kts', 'app/android/app/build.gradle.kts', 'app/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 预热:把 assembleDebug 依赖的整条链(app 的依赖图 + Flutter 自带 gradle 插件
      # 那个 includeBuild 的 Kotlin 编译器)先拉齐并落进缓存。失败退避重试 3 次。
      # 这一遍构建同时让后面模拟器里的 assembleDebug 变成增量构建。
      - name: 预热 Gradle 依赖(失败退避重试,抗上游 504)
        working-directory: app
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug --dart-define=API_BASE=http://127.0.0.1:1/api/v1; then
              echo "Gradle 预热成功(第 ${attempt} 次)"
              exit 0
            fi
            echo "::warning title=Gradle 预热失败::第 ${attempt}/3 次失败,等待 $((attempt * 30))s 后重试"
            sleep $((attempt * 30))
          done
          echo "::error title=Gradle 预热失败::连续 3 次失败 —— 按上游不可用处理,不要当代码红去查"
          exit 1

      # script 必须是**单行**:android-emulator-runner 逐行 `sh -c` 执行 script
      # (每行一个独立进程),所以续行 `\`、跨行 `set -e`、`$?`/重定向都会失效 ——
      # 第 1 轮 CI 就红在续行上(多出来的 `\` 被当成第三个测试路径,flutter 于是
      # 报「Integration tests and unit tests cannot be run in a single invocation」)。
      # `--reporter expanded` 的完整输出本身就在 job log 里,不再另外上传 artifact。
      # 两个 integration 文件放在**同一次** flutter test 调用里(路径并列),不要拆成两行
      # script —— `android-emulator-runner` 逐行起进程,拆开等于让第二条在模拟器已经
      # 被前一条占用/清理之后重跑一遍构建,白烧几分钟。
      # 两条都用 `--dart-define=API_BASE=http://127.0.0.1:1/api/v1` 把后端打死:
      # `smoke_test` 验「连不上也落在登录页」,`discovery_filter_test` 把标签池
      # override 成固定值、只验面板的**真实命中测试**(chip 选中 / 滑块拖动)。
      # `post_card_actions_test` / `chat_multi_select_test` 同理:假 IM + 假网络,
      # 只验手势(动态卡三块热区互不串 / 多选模式下点气泡是切换勾选)。
      # **新增 integration 文件必须加进下面这一行的路径列表**,否则 CI 根本不会跑它。
      # `golden_test` 只做像素比对(基准图已提交在 app/integration_test/goldens/),
      # 它的失败原因通常是「外观变了」,与上面四条行为用例分开看。
      - name: 在模拟器上跑 integration_test(冒烟 + 筛选面板 + 动态卡 + 聊天多选 + golden)
        if: ${{ !inputs.update_goldens }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          working-directory: app
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/smoke_test.dart integration_test/discovery_filter_test.dart integration_test/post_card_actions_test.dart integration_test/chat_multi_select_test.dart integration_test/golden_test.dart -d emulator-5554 --dart-define=API_BASE=http://127.0.0.1:1/api/v1 --reporter expanded

      # ── golden 基准图重生成(W-L3)────────────────────────────────────────────
      # 只在 workflow_dispatch 且 update_goldens=true 时跑:用 `--update-goldens` 让宿主侧
      # 把两张 PNG 写进 `app/integration_test/goldens/`,再由下面一步当 artifact 上传。
      # **不自动提交** —— 基准图进仓库必须经过一次人工确认(看两张图确实是登录页/首页,
      # 而不是骨架屏或豆腐块),所以留成「下载 → 提交」两步。
      # 只跑 golden_test 一个文件:这一遍的目的是重写基准,不是回归。
      - name: 重写 golden 基准图(仅 workflow_dispatch + update_goldens)
        if: ${{ inputs.update_goldens }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          working-directory: app
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/golden_test.dart --update-goldens -d emulator-5554 --dart-define=API_BASE=http://127.0.0.1:1/api/v1 --reporter expanded

      - name: 上传 golden 基准图 artifact
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens
          path: app/integration_test/goldens/
          if-no-files-found: error

