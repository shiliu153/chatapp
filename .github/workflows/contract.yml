name: 跨栈契约

# 门禁清单的唯一事实来源是 `scripts/gates.toml`,执行器是 `scripts/run_gates.py`:
# 本地 `scripts/verify.sh contract` 与本 workflow 跑**同一份清单、同一个执行器**,
# 所以「本地绿 ≈ CI 绿」不再靠手抄(见 docs/standards/sources-of-truth.md §2.3 / §4 C5)。
#
# 2026-11-12(P0 审计):**去掉 paths 过滤**。它和 backend.yml / web.yml 一起被设为
# 默认分支的 required status check,而 required check 的前提是「每次 PR 都会出现」——
# 按 paths 跳过会让 PR 永远 pending,或者(更糟)让「没有 check」被当成绿。
# 这条轨是秒级的,全跑不心疼。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # 显式 job name:它同时是 check run 的 name,也是 ruleset required_status_checks 的 context。
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # 两道门禁的外部依赖:PyYAML(docs_* 脚本)与 shellcheck(静态检查)。
      # 缺工具是 fail-closed(gates.toml 的 requires),装不上就会红,不会静默跳过。
      - name: 装外部工具(PyYAML / shellcheck)
        run: |
          pip install PyYAML
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # 一个 step 跑完全部门禁:执行器逐条 `::group::` 打印、失败时打
      # `::error title=<id>::`,「哪道门禁红了」看日志里的 id 即可,不需要 19 个 step。
      - name: 门禁注册表(scripts/gates.toml)
        run: python scripts/run_gates.py --scope contract
