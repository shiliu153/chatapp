name: 跨栈契约

# 只跑「不需要数据库 / 不需要 Flutter / 不需要 npm」的秒级检查,所以单独一个 workflow:
#   - 版本号三处一致(事实来源 app/pubspec.yaml)
#   - App 手写模型读取的字段 ⊆ OpenAPI 契约
# 生成物与代码的一致性(openapi.yml / schema.d.ts)在 backend.yml 与 web.yml 里各自守着。
#
# 2026-11-12(P0 审计):**去掉 paths 过滤**。它和 backend.yml / web.yml 一起被设为
# 默认分支的 required status check,而 required check 的前提是「每次 PR 都会出现」——
# 按 paths 跳过会让 PR 永远 pending,或者(更糟)让「没有 check」被当成绿。
# 这条轨是秒级的,全跑不心疼。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # 显式 job name:它同时是 check run 的 name,也是 ruleset required_status_checks 的 context。
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: 装 PyYAML(脚本只依赖它)
        run: pip install PyYAML

      - name: 版本号三处一致(app/pubspec.yaml 为准)
        run: python scripts/sync_version.py --check

      - name: 版本号同步脚本自测
        run: python -m unittest scripts.test_sync_version -v

      - name: 发版准备脚本自测(W 批:release_prep.py 的闸门/版本号/notes)
        run: python -m unittest scripts.test_release_prep -v

      - name: App 手写模型字段 ⊆ OpenAPI 契约
        run: python scripts/check_app_models.py --verbose

      # 贴纸是打包进两端的静态资源:两端文件名/字节/尺寸必须完全一致,
      # 否则同一条贴纸消息在 App 与 Web 会渲染出不同的图(单测看不出来)。
      - name: 贴纸资源两端一致(app/assets ↔ web/public)
        run: python scripts/check_stickers.py

      # 告警中转脚本只用标准库,秒级可测:载荷渲染、去重键、HTTP 入口与失败收敛。
      # 这条链路哑了没人会发现(告警本来就不常发),所以必须有回归。
      - name: 告警转发脚本自测
        run: python -m unittest discover -s deploy/observability -p 'test_*.py' -v

      # 出口代理的渲染脚本是「坏订阅」的唯一防线:机场偶尔返回 HTML 错误页或残配置,
      # 写进 config.yaml 会让 mihomo 起不来 → worker 全断网,而现场看起来像「代理没开」。
      # 纯离线(不拉订阅、不碰真实配置),秒级。
      - name: 出口代理渲染自测
        run: bash scripts/superagent-proxy/selftest.sh

      # gh-guard 是 worker 唯一的机械拦截(AGENTS.md 的「不自合、不发版」)。
      # 它此前**没有任何回归**:坏了没人知道,而绕过口(gh api REST 合并)直到
      # 2026-11-12 的 P0 审计才发现。这里把它钉进 contract 轨。
      - name: gh-guard 拦截自测
        run: sh scripts/gh-guard/selftest.sh

      # 部署闸门:纯标准库 + 临时 git 仓库自测,不联网、不碰生产。
      - name: 部署闸门自测
        run: python -m unittest scripts.test_deploy_gate -v

      # 改动面判定器:backend / web 两条重活轨靠它决定「无关时跳过」。
      # 它坏掉的两种后果都不能静默发生:把重活全跳过(门禁漏),或把每个 PR 拖成 10 分钟。
      - name: 改动面判定器自测
        run: bash scripts/test_ci_scope.sh

      # L4「需求自动入队」是整条阶梯里唯一会**替人决定做什么**的一级,也是唯一每天
      # 主动往待办里写东西的机制。判定器坏掉的三种后果都由这两条钉住:多判(把假需求
      # 塞进待办)、少判(真失败没人管)、判不出来却开了单(该 fail-closed 却放行)。
      # 纯离线:输入是 JSON 快照与临时目录,不联网、不碰 issue。
      - name: L4 入队判定器自测
        run: python -m unittest scripts.test_l4_intake -v

      # 文档断链检测是 L4「机械一致性」信号唯一的实现;它自己坏了没人会当场发现
      # (没有任何 workflow 读 Markdown 链接),所以同一条轨里钉住。
      - name: 文档断链检测自测
        run: python -m unittest scripts.test_check_docs_links -v

      # docs_lint 是「docs/ 只放文档」的唯一执行器:结构 / 断链 / 索引覆盖三条规则。
      # 判定器自己坏掉的两个方向都不能静默:漏报 = 治理成果回流(脚本又躺回 docs/、
      # 新文档又进不了索引);误报 = 人被逼着把它关掉。纯离线,临时目录造样本。
      - name: docs_lint 自测
        run: python -m unittest scripts.test_docs_lint -v

      # 上面那条只证明判定器「判得对」,这条才证明**当前仓库**合规。此前写坏链接、
      # 把脚本塞回 docs/ 都不会让任何 workflow 红 —— 只改文档的 PR 全绿是常态。
      - name: docs_lint(docs/ 结构 + 断链 + 索引覆盖)
        run: python scripts/docs_lint.py

      # worker 巡检器(superagent-health)判错的两个方向都不能静默:把正常报成异常
      # (告警被当噪音关掉)、把异常报成正常(虚假的安全感)。它自己也在用 systemd timer
      # 盯着 worker,所以它坏了必须有回归挡住。
      - name: worker 巡检器自测
        run: python -m unittest scripts.test_superagent_health -v

      # deploy/ 下的脚本(一键部署、备份、看门狗、恢复演练)此前**不在任何 CI 轨里**:
      # 备份是 CLAUDE.md 列的两大风险之一,脚本语法坏掉却没人知道。这里做最低限度的
      # 语法检查(bash -n):不装依赖、不联网、不改脚本。逻辑类问题(shellcheck)留待后续。
      - name: shell 脚本语法检查(bash -n)
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n 失败"
              rc=1
            fi
          done < <(git ls-files '*.sh')
          exit "$rc"

      # shellcheck 抓 bash -n 抓不到的**逻辑类** error(未定义命令、错误的 test 用法等)。
      # 只跑 error 级:warning/info 在现有脚本里有大量风格项,全开会变成噪音。
      # 2026-11-12 在 LF 版本的 HEAD 上实测 error 级为零。
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shell 脚本静态检查(shellcheck,error 级)
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r f; do
            if ! shellcheck -S error "$f"; then
              echo "::error file=$f::shellcheck 报 error"
              rc=1
            fi
          done < <(git ls-files '*.sh')
          exit "$rc"
