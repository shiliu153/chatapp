name: App (Flutter)

on:
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  # 静态检查与 UI 测试都不需要真实后端:测试用假网络 + 假 IM 适配器
  analyze-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: 拉依赖
        run: flutter pub get

      - name: 静态检查(必须零告警)
        run: flutter analyze

      - name: 跑测试
        run: flutter test --reporter expanded
