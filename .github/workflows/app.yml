name: App (Flutter)

on:
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      # 跨栈协议 fixture(E-2):只改 fixture 也要跑 App 的契约测试
      - 'imserver/tests/fixtures/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'imserver/tests/fixtures/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  # 静态检查与 UI 测试都不需要真实后端:测试用假网络 + 假 IM 适配器
  analyze-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: 拉依赖
        run: flutter pub get

      - name: 静态检查(必须零告警)
        run: flutter analyze

      - name: 跑测试
        run: flutter test --reporter expanded
