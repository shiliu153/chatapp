name: Web (Vue)

on:
  push:
    branches: [master, main]
    paths:
      - 'web/**'
      - 'docs/api/**'
      # 跨栈协议 fixture(E-2):只改 fixture 也要跑 Web 的契约测试
      - 'imserver/tests/fixtures/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'docs/api/**'
      - 'imserver/tests/fixtures/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  # 本轨只守类型/规范/单测/构建;端到端冒烟见 web-e2e.yml(E-3:真 MySQL+Redis+Django)
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 拉依赖
        run: npm ci

      # D-5:``src/api/schema.d.ts`` 是 openapi-typescript 从后端 schema 生成的纯类型文件。
      # 这里重新生成一次再比对:后端改了字段却没同步生成物,CI 立刻红。
      - name: 校验 API 类型生成物与后端 schema 一致
        run: |
          npm run gen:api
          git -C .. diff --exit-code -- web/src/api/schema.d.ts

      - name: 类型检查(必须零错误)
        run: npm run type-check

      - name: 代码规范(必须零告警)
        run: npm run lint

      - name: 单元/组件测试
        run: npm run test:run

      - name: 构建
        run: npm run build
