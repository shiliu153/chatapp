name: Web (Vue)

# 2026-11-12(P0 审计):workflow 级**不再按 paths 过滤**,改成「job 总是出现、重活按改动面跑」。
#
# required status check 必须每次 PR 都出现,但 npm ci + 覆盖率 + 构建(3–5 分钟)不该在
# 每个 PR 都跑。`scope` job 秒级判定本次改动是否触及网页端;无关时 `check` job 被跳过,
# check 结论是 skipped(required check 语义里视为满足)。判定失败一律按「要跑」处理。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  scope:
    name: web-scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false

      - name: 判断本次改动是否触及网页端
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          run=$(bash scripts/ci-scope.sh web) || run="run=true"
          echo "判定结果:$run"
          echo "$run" >> "$GITHUB_OUTPUT"

  # 本轨只守类型/规范/单测/构建;端到端冒烟见 web-e2e.yml(E-3:真 MySQL+Redis+Django)
  # 显式 job name:它同时是 check run 的 name,也是 ruleset required_status_checks 的 context。
  check:
    name: web
    needs: scope
    if: always() && (needs.scope.outputs.run == 'true' || needs.scope.result != 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 拉依赖
        run: npm ci

      # D-5:``src/api/schema.d.ts`` 是 openapi-typescript 从后端 schema 生成的纯类型文件。
      # 这里重新生成一次再比对:后端改了字段却没同步生成物,CI 立刻红。
      - name: 校验 API 类型生成物与后端 schema 一致
        run: |
          npm run gen:api
          git -C .. diff --exit-code -- web/src/api/schema.d.ts

      - name: 类型检查(必须零错误)
        run: npm run type-check

      - name: 代码规范(必须零告警)
        run: npm run lint

      # 覆盖率门槛(`vitest.config.ts` 的 thresholds)只在 `--coverage` 时生效。
      # 2026-11-12 之前这里跑的是 `test:run`(不带 --coverage),于是文档声称的
      # 70/60/70/70 门槛在 CI 里从未执行过 —— 门禁是纸面的。见 P0 审计。
      - name: 单元/组件测试(含覆盖率门槛 70/60/70/70)
        run: npm run test:coverage

      - name: 构建
        run: npm run build
