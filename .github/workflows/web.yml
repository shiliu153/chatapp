name: Web (Vue)

# 2026-11-12(P0 审计):workflow 级**不再按 paths 过滤**,改成「job 总是出现、重活按改动面跑」。
#
# required status check 必须每次 PR 都出现,但 npm ci + 覆盖率 + 构建(3–5 分钟)不该在
# 每个 PR 都跑。`scope` job 秒级判定本次改动是否触及网页端;无关时 `check` job 被跳过,
# check 结论是 skipped(required check 语义里视为满足)。判定失败一律按「要跑」处理。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  scope:
    name: web-scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false

      - name: 判断本次改动是否触及网页端
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          run=$(bash scripts/ci-scope.sh web) || run="run=true"
          echo "判定结果:$run"
          echo "$run" >> "$GITHUB_OUTPUT"

  # 本轨只守类型/规范/单测/构建;端到端冒烟见 web-e2e.yml(E-3:真 MySQL+Redis+Django)
  # 显式 job name:它同时是 check run 的 name,也是 ruleset required_status_checks 的 context。
  check:
    name: web
    needs: scope
    if: always() && (needs.scope.outputs.run == 'true' || needs.scope.result != 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 门禁与本地同源:npm ci + 生成物校验(schema.d.ts)+ `scripts/gates.toml` 的 web 组
      # (type-check / lint / test:coverage / build),都在 `scripts/stacks/web.sh` 里。
      # 本地 `scripts/verify.sh web` 调的就是这份脚本。
      - name: 网页端门禁(与本地 verify.sh web 同一份脚本)
        working-directory: ${{ github.workspace }}
        run: bash scripts/stacks/web.sh
