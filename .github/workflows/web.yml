name: Web (Vue)

# 2026-11-12(P0 审计):**去掉 paths 过滤**。本轨与 contract / backend 一起是默认分支的
# required status check;required check 必须「每次 PR 都出现」,按 paths 跳过会让 PR
# 永久 pending,或让「没有 check」被误当成绿。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # 本轨只守类型/规范/单测/构建;端到端冒烟见 web-e2e.yml(E-3:真 MySQL+Redis+Django)
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 拉依赖
        run: npm ci

      # D-5:``src/api/schema.d.ts`` 是 openapi-typescript 从后端 schema 生成的纯类型文件。
      # 这里重新生成一次再比对:后端改了字段却没同步生成物,CI 立刻红。
      - name: 校验 API 类型生成物与后端 schema 一致
        run: |
          npm run gen:api
          git -C .. diff --exit-code -- web/src/api/schema.d.ts

      - name: 类型检查(必须零错误)
        run: npm run type-check

      - name: 代码规范(必须零告警)
        run: npm run lint

      # 覆盖率门槛(`vitest.config.ts` 的 thresholds)只在 `--coverage` 时生效。
      # 2026-11-12 之前这里跑的是 `test:run`(不带 --coverage),于是文档声称的
      # 70/60/70/70 门槛在 CI 里从未执行过 —— 门禁是纸面的。见 P0 审计。
      - name: 单元/组件测试(含覆盖率门槛 70/60/70/70)
        run: npm run test:coverage

      - name: 构建
        run: npm run build
