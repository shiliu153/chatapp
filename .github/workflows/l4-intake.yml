name: L4 需求自动入队

# L4:把「人写 issue」这个闸门换成**确定性判定**。
#
# 它是整条阶梯里唯一会替人决定「做什么」的一级,所以口径写死成三条机器判据
# (见 docs/superpowers/specs/2026-11-08-superagent-automation-ladder-design.md §6):
#
#   1. ci-red        默认分支上某条 workflow 的最新 push run 是红的,且该栈能在
#                    scripts/verify.sh 里自证(backend / web / imserver / app 四条)。
#   2. dep-advisory  `npm audit --json` 命中 + 有修复版本 + **锁文件里实际装的版本
#                    仍落在受影响区间内**(npm audit 本身就读锁文件,这一条是双保险)。
#                    pip / docker / actions 侧**不在白名单**(见 spec §6.1 的「否」列)。
#   3. mech-docs-links  docs/ 里的相对链接指向不存在的路径。
#
# 三条硬规矩:
#   - **判不出来就不开单**(fail-closed),但整轮 run 标红 —— 判定器坏了必须有人知道;
#     这与 ci-scope.sh 的取舍相反:那里漏跑门禁更糟,这里误开单会污染待办。
#   - **去重**:同一失败只追加评论 / 重开原单,绝不每天开一条新的。
#   - **绝不派单**:正文不 @ 任何人,派工仍由人评论触发(否则等于绕过人工审查)。
#
# 开关(仓库 Actions variable):L4_INTAKE=on 才工作;off / 未设置 → 直接退出 0。
#   紧急停:gh variable set L4_INTAKE --body off --repo shiliu153/chatapp
# 运维口径:docs/ops/superagent.md §14

on:
  schedule:
    # 09:20 北京时间(01:20 UTC),故意排在 main-health(09:00)之后:
    # 先让「默认分支有红轨」的聚合 issue 落地,再按栈开可接的单。
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印将要做什么,不开单 / 不评论'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write          # 开单 / 评论 / 重开 + 建标签
  actions: read          # 读 workflow 的 run 结论

concurrency:
  group: l4-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # 依赖信号靠 `npm audit`,所以要 node。版本跟随仓库约定(Node 22)。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # 判定器全是标准库,不装任何依赖(连 PyYAML 都不需要)。
      - name: 总闸
        id: gate
        env:
          L4_INTAKE: ${{ vars.L4_INTAKE }}
        run: |
          set -uo pipefail
          if [ "${L4_INTAKE:-off}" != "on" ]; then
            echo "::notice title=L4 需求自动入队未启用::repo variable L4_INTAKE=${L4_INTAKE:-未设置}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # 事实采集:只取快照,**不做任何判断**。判断全在 scripts/l4_intake.py 里(可离线自测)。
      #
      # 读不出来的原因**必须进日志**:fail-closed 的意义是「坏了有人知道」,而不是
      # 「坏了只看到一句 red」。2026-11-12 首次真跑就踩了这条:旧版把 gh 的 stderr
      # 丢进 /dev/null,于是 run 红了、Summary 里只有「告警响应不是列表」,
      # 分不出是「没开 Dependabot」还是「GITHUB_TOKEN 没这个权限」。
      - name: 采集事实(红轨 / 依赖告警 / 已有 L4 工单)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # 默认分支名从事件里取:2026-11-11 的 master→main 改名曾让写死 ref 的机制静默失效。
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          mkdir -p .l4

          # 把「读不到」的原因原样写进判定器的输入,顺带打到日志上。
          fail_json() { # fail_json <stderr 文件> <输出文件>
            jq -cn --arg r "$(cat "$1" 2>/dev/null)" '{__error__: $r}' > "$2" 2>/dev/null \
              || echo '{"__error__":"连错误原因都写不出来"}' > "$2"
          }

          # 与 main-health.yml 同一条 API、同一个解析器(l4_intake.py ci-red-summary),
          # 不复制扫描逻辑。
          if ! gh api "repos/$REPO/actions/runs?branch=$BASE&event=push&per_page=100" \
                > .l4/runs.json 2> .l4/runs.err; then
            echo "::warning::读不到 runs:$(cat .l4/runs.err 2>/dev/null)"
            fail_json .l4/runs.err .l4/runs.json
          fi

          # 依赖信号的事实源:`npm audit --json`。
          #
          # 为什么**不是** dependabot 告警接口:私有仓库上 GITHUB_TOKEN 读
          # `/repos/{o}/{r}/dependabot/alerts` 返回 **403 Resource not accessible by
          # integration**(2026-11-12 首轮真跑实测,`security-events: read` 已授到也照样 403)。
          # `npm audit` 用同一套公告库、直接读 `web/package-lock.json`,任何 token 都能跑,
          # 而且「锁文件里到底装的什么」本来就是我们要的口径。
          # 有漏洞时 npm audit 的退出码非 0 —— 那是正常输出,只看产出是不是合法 JSON。
          if [ -f web/package-lock.json ]; then
            ( cd web && npm audit --json ) > .l4/npm-audit.json 2> .l4/npm-audit.err
            if jq -e '.vulnerabilities' .l4/npm-audit.json >/dev/null 2>&1; then
              python scripts/l4_intake.py from-npm-audit \
                --input .l4/npm-audit.json --out .l4/alerts.json
            else
              echo "::warning::npm audit 没产出可用报告:$(head -c 400 .l4/npm-audit.err 2>/dev/null | tr '\n' ' ')"
              fail_json .l4/npm-audit.err .l4/alerts.json
            fi
          else
            echo "::warning::没有 web/package-lock.json,依赖判据无从判定"
            echo '{"__error__":"web/package-lock.json 不存在"}' > .l4/alerts.json
          fi

          # 去重靠 body 里的指纹;每天新建数靠 createdAt(UTC 日)。
          if ! gh issue list --repo "$REPO" --label l4-auto --state all --limit 100 \
                --json number,title,state,body,createdAt > .l4/issues.json 2> .l4/issues.err; then
            echo "::warning::读不到已有 l4-auto issue:$(cat .l4/issues.err 2>/dev/null)"
            fail_json .l4/issues.err .l4/issues.json
          fi

          echo "已采集: workflows=$(jq '.workflow_runs | length' .l4/runs.json 2>/dev/null || echo '?')" \
               "公告记录=$(jq 'length' .l4/alerts.json 2>/dev/null || echo '?')" \
               "已有单=$(jq 'length' .l4/issues.json 2>/dev/null || echo '?')"

      - name: 判定(纯离线,产出计划 + 日报)
        if: steps.gate.outputs.enabled == 'true'
        env:
          # 限额与阈值的覆盖口(都不设就用默认:5 张/日、high)。
          L4_MAX_PER_DAY: ${{ vars.L4_MAX_PER_DAY }}
          L4_MIN_SEVERITY: ${{ vars.L4_MIN_SEVERITY }}
        run: |
          set -uo pipefail
          python scripts/l4_intake.py plan \
            --runs .l4/runs.json \
            --alerts .l4/alerts.json \
            --existing .l4/issues.json \
            --root . \
            --json-out .l4/plan.json \
            --summary-out .l4/summary.md
          cat .l4/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 执行(开单 / 追加评论 / 重开)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -uo pipefail
          args=(--plan .l4/plan.json --repo "$REPO")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          # 退出码 1 = 有命令失败,或判定器「判不出来」(fail-closed 已保证没开单)。
          # 这条 red 是**故意**的:判定器坏掉不能静默。
          python scripts/l4_intake.py apply "${args[@]}"

      - name: 保留计划与事实快照(便于人复核这一轮凭什么开单)
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l4-plan
          path: .l4/
          retention-days: 14
          if-no-files-found: ignore
