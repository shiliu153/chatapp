name: imserver

on:
  push:
    paths:
      - "imserver/**"
      - "tools/im_*.py"
      - ".github/workflows/imserver.yml"
  pull_request:
    paths:
      - "imserver/**"
      - "tools/im_*.py"
      - ".github/workflows/imserver.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 门禁与本地同源:`scripts/gates.toml` 的 imserver 组(单元 / 集成 / HTTP e2e),
      # 本地 `scripts/verify.sh imserver` 调的就是同一份脚本、同一组命令。
      - name: imserver 门禁(与本地 verify.sh imserver 同一份脚本)
        run: bash scripts/stacks/imserver.sh
