# 本地覆写:盖掉机场订阅里那几项「在无人值守 WSL 里不安全或会撞车」的设置。
#
# 为什么需要这一层(而不是直接用机场下发的配置):
#   1. 机场默认 allow-lan: true + bind-address: '*'
#      → 等于给局域网开了一个免认证的开放代理。这台机器在 WSL 里,
#        一旦宿主网络可被同网段访问,任何人都能拿它当跳板。
#        render-config.py 还会再强制写一遍 false / 127.0.0.1 兜底。
#   2. 机场默认 external-controller: 127.0.0.1:9090
#      → Windows 侧 Clash 客户端的 controller 惯例也占 9090,而 WSL 的
#        localhostForwarding 会把 WSL 端口映射到 Windows localhost,必然打架。
#        改用 9091,并只监听回环。
#   3. mixed-port 7890:Windows 侧现有客户端用 7897,7890 是空的(已实测)。
#        这样两套代理可以并存 —— 宿主那套留着当兜底。
#
# 端口改了要同步改 /root/start-superagent.sh 的探测顺序(见
# scripts/superagent-start/start-superagent.sh 的 PROXY_PORT)。

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
external-controller: 127.0.0.1:9091
mode: rule
log-level: info

# 关掉「选择记忆」(2026-11-15,有实测):
#   select 组的手动选中会被 mihomo 存进 cache.db,重载/重启后**优先于配置里的 proxies[0]**。
#   于是「节点选择」可能被钉在某个具体节点上 —— 而单个节点没有任何健康检查。
#   2026-11-15 实测就撞上了:`节点选择 now=🇸🇬|新加坡-IEPL 02`,而我们精心配的
#   github / github-fallback 两个组根本没在出口链路上,健康检查等于白做。
#   关掉之后,配置里的 proxies[0] 是唯一事实来源;refresh.sh 每次热重载后还会再对齐一次。
profile:
  store-selected: false

# ── 传输层四项(2026-11-25 在运行时先加、2026-11-28 固化进仓库)───────────────
# 这四项原先只存在于运行时的 /root/.dsh/proxy/bin/override.yaml。问题在于「重跑
# install.sh 会把它们冲掉」—— 也就是说它们是**漂移**而不是配置。每项的理由:

# ① 关 IPv6:这台 WSL 只有 eth0 的 fe80::/64,**没有 IPv6 默认路由**,而机场节点会解析出
#    AAAA。mihomo 的 journal 里每条失败都会先白试一次 v6 再回落 v4 —— 一倍的失败噪音,
#    还会把 url-test 的 delay 抬高。关掉之后 v6 地址直接不解析。
ipv6: false

# ② 并发建连:节点瞬时失效时(§12.6「节点级瞬时失效是本机常态」)顺序建连要一个接一个
#    i/o timeout,而并发建连只要有一条通就成。worker 一轮要读 60~100 次 GitHub,
#    这条是「单节点抽风不再整轮失败」的关键。
tcp-concurrent: true

# ③ 统一延迟口径:url-test 的 delay 默认取「最后一次握手」,而并发建连后每次握手路径可能不同,
#    不统一就会出现「同一个节点测出两个差很多的 delay」,组内来回抖(与 tolerance 打架)。
unified-delay: true

# ④ keep-alive 30s:GitHub 那侧对空闲连接有回收,30s 的心跳比默认 15s 少一半无谓报文,
#    又比「不保活」少一次 TLS 重建。实测经 mihomo 单次耗时从 1.7s 降到 0.85~1.0s 区间。
keep-alive-interval: 30

# 注意:以上都是顶层键,render-config.py 的 apply_override 会原样盖进最终 config.yaml;
# 改完记得跑 `bash scripts/superagent-proxy/install.sh` 让运行时跟仓库一致,
# 再 `mihomo -t -f /root/.dsh/proxy/config.yaml -d /root/.dsh/proxy` 验语法。

# GitHub 专用测速组。机场自带的「自动选择」测的是 http://cp.cloudflare.com,
# 选出来的是「连 cloudflare 最快的节点」,不等于「能稳定拉 GitHub 的节点」。
# 本项目的实际痛点是 api.github.com 新建 TLS 连接被间歇重置(§11),
# 所以这里直接拿 GitHub 当测速目标。
#
# 健康检查窗口为什么是 60 秒(2026-11-15 从 300s 收紧):
#   url-test 组只在**测速那一刻**知道节点死没死。窗口 300s 意味着节点刚测完就挂掉时,
#   最长 5 分钟内每条请求都往死节点上撞 —— 2026-11-14 21:28 实测到的那 2 分钟窗
#   (经 7890 连续 4 次 000、同一时刻直连连续 4 次 200、21:29:33 自己恢复)就是它的形状。
#   12 个 IEPL 节点测一轮的成本可以忽略,所以窗口压到 60s:最坏自愈时间从 5 分钟降到 1 分钟。
#   timeout 与 max-failed-times 一起收紧:单次测速别拖到 5s,一次测不通就当它是死的。
github_group:
  name: github
  url: https://api.github.com/rate_limit
  interval: 60         # 60 秒一次;只测 IEPL 精选(≤12 个),不是 106 个全测
  timeout: 3000        # ms;单次测速超时,默认 5s 会把一轮自愈拖长
  max_failed_times: 1  # 测不通一次就判死,立刻换节点(默认 5 次太钝)
  tolerance: 100       # ms;差值小于这个不切,避免来回抖
  max_nodes: 12
  include_pattern: IEPL   # 只挑专线;中转/直连线路实测更差
  exclude_pattern: 流量|套餐|重置|到期

# 组级兜底(2026-11-15 加):github 组是 url-test,它只能在**它自己的节点池**里换;
# 万一整池 IEPL 一起抽风(机场单线路故障),worker 就没有出口了。所以再套一层 fallback:
# 先走 github 组(按 GitHub 实测选出的最佳 IEPL),该组整体判死时立刻落到机场自带的全量池。
# 注意 members 的顺序就是优先级,别把「自动选择」放前面 —— 它测的是 cloudflare,与 GitHub 无关。
github_fallback:
  name: github-fallback
  interval: 60
  timeout: 3000
  members:
    - github          # 第一层:IEPL 里按 GitHub 实测最好的那个
    - 自动选择        # 第二层:机场全量节点池(105 个),组级兜底
