# 门禁注册表 —— **门禁清单的唯一事实来源**(治理方案第 4 节)。
#
# 为什么需要它
# ------------
# 2026-11-14 之前,「门禁清单」这件事有两个 owner:`contract.yml` 的 19 个 step 与
# `verify.sh::stack_contract()` 的 15 条 `run`。两边靠手抄维持,于是慢慢分叉 ——
# CI 独有 5 条、本地独有 1 条、另有 1 条两边都没跑,且**没有任何一条命令是逐字相同的**
# (`sources-of-truth.md` §4 C5)。手抄的镜像不是镜像。
#
# 现在:命令只写在这一个文件里,本地(`scripts/verify.sh contract`)与 CI
# (`.github/workflows/contract.yml`)调**同一个执行器** `scripts/run_gates.py`,
# 于是「本地绿 ≈ CI 绿」是机械成立的,不是纪律。
#
# 怎么加一道门禁(改动点 = 1 处)
# ------------------------------
# 在本文件加一个 `[[gate]]`,别的都不用动。两条轨会自动同时拥有它;
# `scripts/test_gates.py` 会拦住「两边又出现命令字面量」「--list 与注册表不一致」。
#
# 字段
# ----
# id       唯一标识,形如 `<scope>-<slug>`。**必须按 POSIX 字节序升序排列**
#          (执行器按 id 排序输出,`--list` 的输出会被 lint 比对,顺序必须跨平台稳定;
#          第 3 节踩过 `sorted(Path)` 在 Windows 大小写不敏感、在 Linux 敏感的坑)。
# scope    contract / backend / web / imserver / app —— 对应 `run_gates.py --scope`。
# kind     python:命令以 `python` 开头,执行器把它换成 `$CHATAPP_PY`(本地 venv / CI 的 python);
#          shell:整条命令交给 `bash -c`(可写多行脚本)。
# command  真正执行的命令。**这里之外不许出现门禁命令字面量**(由 test_gates.py 判)。
# reason   一句话「为什么需要它」,从原来 workflow 的注释里搬过来 —— 门禁的意义不能只活在
#          已删除的注释里。
# cwd      可选,相对仓库根的执行目录(默认 `.`)。backend / web / app 的门禁各自在自己目录跑。
# requires 可选,外部工具名列表。**缺工具 = 该门禁红(fail-closed)**,错误信息给安装命令 ——
#          宁可本地红一次,也不要「本地少跑一条还以为绿」(那正是 C5 的复发形态)。
# env      可选,该门禁专用的环境变量(内联表)。只在子进程里生效,不污染别的门禁。
#
# 约定
# ----
# - 命令里不写绝对路径、不写时间戳:同一份清单在 Windows / WSL / CI 上必须行为一致。
# - 顺序即 id 升序;`scripts/test_gates.py` 会断言这一点,插错位置即红。

# --- App ------------------------------------------------------------------

[[gate]]
id = "app-analyze"
scope = "app"
kind = "shell"
cwd = "app"
command = "flutter analyze"
reason = "静态检查零告警是 App 的硬门槛(analyze 有告警等于没写测试)"

[[gate]]
id = "app-raw-values"
scope = "app"
kind = "python"
command = "python scripts/check_app_raw_values.py --check"
reason = "Ember §11.2 的「裸值」一行此前只有人工 grep(E-5.1~E-5.6 六单的验收都是手写一条 grep,而 grep 只认 0xFF,认不出 fontSize: 17 / EdgeInsets.all(16) / BorderRadius.circular(9)):视觉取值必须走 tokens —— 生成物 tokens.g.dart 由 design_tokens 守住源头,这条守住「页面里不许再写死」。纯 Python 扫文件,秒级且不起 Flutter"

[[gate]]
id = "app-test"
scope = "app"
kind = "shell"
cwd = "app"
command = "flutter test --reporter expanded"
reason = "App 测试用假网络 + 假 IM 适配器,不需要真后端;reporter expanded 让 CI 日志能定位到用例"

# --- backend --------------------------------------------------------------

[[gate]]
id = "backend-e001-gate"
scope = "backend"
kind = "shell"
cwd = "chatapp"
env = { DEBUG = "0", SMS_DEV_MODE = "1", SMS_PHONE_WHITELIST = "", IM_MEDIA_SIGN_SECRET = "ci-fake-media-secret-32-bytes", IM_MEDIA_PREFIX = "http://127.0.0.1:8000/media/chat/", MEDIA_BASE_URL = "http://127.0.0.1:8000" }
command = '''
out=$("$CHATAPP_PY" manage.py check 2>&1)
rc=$?
printf '%s\n' "$out"
if [ "$rc" = 0 ]; then
  echo "::error::DEBUG=0 + SMS_DEV_MODE=1 + 空白名单 时 check 竟然通过 —— accounts.E001 门禁失效"
  exit 1
fi
case "$out" in
  *accounts.E001*) echo "accounts.E001 已生效(门禁可达)" ;;
  *) echo "::error::check 失败了,但输出里没有 accounts.E001(可能是别的错误)"; exit 1 ;;
esac
'''
reason = "accounts.E001 是「生产开了固定验证码但准入名单种子为空」的部署期门禁,此前从未在任何流水线里被执行过 —— 这里用 DEBUG=0 反向验证它真的会响"

[[gate]]
id = "backend-openapi-artifact"
scope = "backend"
kind = "artifact"
command = "docs/api/openapi.yml"
reason = "openapi.yml 是生成物:必须与视图上的 @extend_schema 一致、且已提交到 HEAD(第 5 节 C9:比对语义从 shell 收进 scripts/lib/artifacts.py,这条判定此前不在注册表里)"

[[gate]]
id = "backend-perf-selftest"
scope = "backend"
kind = "python"
command = "python -m unittest perf.test_run -v"
reason = "压测脚本自测防「脚本自己错了却给出好看的数字」(头没发出去、{i} 没替换、令牌落盘);perf/ 在仓库根,manage.py test 抓不到"

[[gate]]
id = "backend-tests"
scope = "backend"
kind = "python"
cwd = "chatapp"
command = "python manage.py test --noinput"
reason = "后端全量测试(前置 MySQL + Redis);这是 backend 轨唯一的重活"

# --- contract(本地与 CI 完全同源;条数以 `python scripts/run_gates.py --list` 为准) ---

[[gate]]
id = "contract-app-manifest-internet"
scope = "contract"
kind = "python"
command = "python scripts/check_app_manifest.py"
reason = "release 包只合并 app/android/app/src/main 的清单,而 Flutter 模板只在 debug/ 与 profile/ 里声明 INTERNET(热重载用):main 缺这一行,整包 socket 全 EPERM、服务端 0 请求,本地调试却完全无感。1.0.1–1.0.14 每个 release 包都是这样(见 docs/pitfalls/android-emulator.md),#483 补回了这一行,但没有任何东西防止它再次消失"

[[gate]]
id = "contract-app-manifest-internet-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_check_app_manifest -v"
reason = "两个方向都会坏:漏报 = 权限又被挪回 debug/ 或合并冲突时丢掉,门禁却说合规(正是它存在的理由);误报 = 注释掉的声明被当成声明、别的 uses-permission 顶替 INTERNET、debug/profile 缺文件被当成违例 —— 人只能把门禁关掉"

[[gate]]
id = "contract-app-models"
scope = "contract"
kind = "python"
command = "python scripts/check_app_models.py --verbose"
reason = "App 手写模型读取的字段必须存在于 OpenAPI 契约,否则运行时才炸"

[[gate]]
id = "contract-app-raw-values-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_check_app_raw_values -v"
reason = "裸值门禁两个方向都会坏:漏报 = 裸 hex / 裸字号 / 裸间距 / 裸圆角回到页面却判合规(它存在的理由),误报 = 注释 / 字符串 / 生成物 / tokens 派生表达式被当成裸值(人只能把门禁关掉);另钉住白名单只增不减(条目失效没红)与「找不到 token 生成物不许伪装成绿」。放在 contract 组而不是 app 组:这条轨每次 PR 都跑,而改门禁本身的改动通常只落在 scripts/"

[[gate]]
id = "contract-check-docs-links-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_check_docs_links -v"
reason = "文档断链检测是 L4「机械一致性」信号唯一的实现,它自己坏了没人会当场发现"

[[gate]]
id = "contract-cpp-comment-gate"
scope = "contract"
kind = "python"
command = "python scripts/check_cpp_comments.py --check"
reason = "imserver 的 C++ 注释是「块」不是 docstring,此前明确没有门禁(cpp.md §8):PR #313 把整套注释块补齐之后,新增 C++ 代码没有任何东西会拦。tree-sitter 给出函数边界,所以声明 / 定义 / lambda / = delete 都能判准,当前基线零误报(文件数 / 块数不写死,现算用 --verbose)"

[[gate]]
id = "contract-cpp-comment-gate-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_check_cpp_comments -v"
reason = "注释门禁的两个方向都不能静默:误报(lambda / = delete / struct / 宏 / 函数体内局部对象)会把人逼着把门禁关掉,漏报则规范退回 review 自觉"

[[gate]]
id = "contract-deploy-gate-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_deploy_gate -v"
reason = "部署闸门防的是「main 红了还上线」,纯标准库 + 临时 git 仓库自测,不碰生产"

[[gate]]
id = "contract-design-contrast"
scope = "contract"
kind = "python"
command = "python scripts/design_contrast.py --check"
reason = "对比度的阈值 owner 是设计规范 §3.4 的分级表,配对映射在 design/contrast-pairs.toml:脚本把两者对撞,双模式逐对判 WCAG 比值与 APCA Lc。判据不写死在代码里,改规范即改门禁"

[[gate]]
id = "contract-design-contrast-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_design_contrast -v"
reason = "对比度门禁最危险的失效形态是「没算却绿了」:规范被挪走 / §3.4 改名 / 表被改坏时必须 fail-closed,配对表引用不存在的档时必须报错。已有 43 条用例中的一半在钉这两面"

[[gate]]
id = "contract-design-spec-sync"
scope = "contract"
kind = "python"
command = "python scripts/design_spec_sync.py --check"
reason = "设计规范 §3.2 的色阶表与 §3.3 的语义色表是给人读的产物,owner 是 design/tokens/*.json:双向判「表里有 token 没有 / token 有表里没有 / 值或透明度不同」。首次接入就抓到一处真漂移(overlay.scrim vs surface.scrim)"

[[gate]]
id = "contract-design-spec-sync-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_design_spec_sync -v"
reason = "双向判定的两个方向都会坏:漏报 = 规范继续承诺不存在的值,误报 = 人被逼着把门禁关掉;另外「表读不出来」必须 fail-closed(标题改名最容易踩),否则空结果会被当成通过"

[[gate]]
id = "contract-design-tokens"
scope = "contract"
kind = "python"
command = "python scripts/design_tokens.py --check"
reason = "design/tokens/*.json 是视觉 token 的唯一事实来源,Dart 与 CSS 两份实现由它生成(手改双份会漂移,这正是旧规范的结构性问题)。门禁按字节比对生成物,CRLF 也过不去"

[[gate]]
id = "contract-design-tokens-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_design_tokens -v"
reason = "生成器判错的两个方向都不能静默:别名悬空/循环会产出空值(渲染成透明,比门禁红难查),色阶自然序与 8 位 alpha 分量顺序错了会静默生成「看起来对」的错误常量"

[[gate]]
id = "contract-figma-tokens-roundtrip-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_figma_tokens_roundtrip -v"
reason = "Figma 免费档没有 Theme、同步只能单文件,「只改值不改结构」这条纪律只能靠这个判据兜住。它错的两个方向都贵:把 hex→rgba、legacy 键名、`$themes` 包裹块误判成结构变更 → 第一次真实往返就红一片,人会把校验器关掉;publish/report 时把真实的类型变更或路径增删当成值变更 → 生成物改形状却当成「改了个色值」混进评审。自测还钉住落盘后的**字节级**不变性(含 LF/CRLF 混存),否则一次改值会带来满文件重排"

[[gate]]
id = "contract-docs-index-check"
scope = "contract"
kind = "python"
command = "python scripts/docs_index.py --check"
reason = "索引与全部计数由扫描生成,生成物必须与磁盘一致(手写计数必然过期,已过期过五次)"

[[gate]]
id = "contract-docs-index-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_docs_index -v"
reason = "索引生成器判错的两个方向都不能静默:漏登(新文档进不了索引)与多登(把生成物自己列进去)"

[[gate]]
id = "contract-docs-lint-run"
scope = "contract"
kind = "python"
command = "python scripts/docs_lint.py"
reason = "上面那条只证明判定器判得对,这条才证明**当前仓库**合规(docs/ 只放文档 + 断链 + 索引覆盖)"

[[gate]]
id = "contract-docs-lint-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_docs_lint -v"
reason = "docs_lint 漏报 = 治理成果回流(脚本又躺回 docs/),误报 = 人被逼着把它关掉"

[[gate]]
id = "contract-facts-run"
scope = "contract"
kind = "python"
command = "python scripts/facts.py --check"
reason = "正文里的统计数字(workflow 条数 / 告警条数 / 接口数 / 文档份数 …)由 scripts/facts.py 计算:哨兵值过期、或者数字裸写没包哨兵,文档就与事实脱钩了 —— 实测抓到过真漂移(capacity-and-reliability.md 同一份文档里写着 10 条与 17 条告警,配置里是 17)"

[[gate]]
id = "contract-facts-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_facts -v"
reason = "数字判定器判错的两个方向都不能静默:漏报 = 文档继续漂移,误报 = 人被逼着把门禁关掉(term 规则第一版差点红一片)"

[[gate]]
id = "contract-gh-guard-selftest"
scope = "contract"
kind = "shell"
command = "sh scripts/gh-guard/selftest.sh"
reason = "gh-guard 是 worker 唯一的机械拦截(不自合 / 不发版),此前没有任何回归,绕过口直到 P0 审计才发现"

[[gate]]
id = "contract-image-pin-gate"
scope = "contract"
kind = "python"
command = "python scripts/check_image_pins.py --check"
reason = "镜像引用必须带 @sha256: digest:裸 tag 会让「同一份 compose 文件」在下次构建时拉出另一份内容,而这种漂移不报任何错。第五轮 L-3 把 deploy 与 imserver 侧全部钉死了(#381 / #382 / #383),CI 的四处 services 镜像(backend / web-e2e 的 mysql 与 redis)随后跟上,扫描面因此含 .github/;这条门禁是让下一个新加的服务不能把纪律悄悄退回去"

[[gate]]
id = "contract-image-pin-gate-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_check_image_pins -v"
reason = "门禁两个方向都会坏:少报 = 裸 tag 没人拦(等于没写);多报 = 自建镜像 / stage 别名 / 变量插值被误判,人只能加白名单把门禁关掉。另外它自己踩过一个坑 —— 按文件后缀判会把 docker-compose.yml.tmpl 整个漏掉,自测里钉住了这条"

[[gate]]
id = "contract-l4-intake-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_l4_intake -v"
reason = "L4 是唯一替人决定做什么的一级:多判污染待办、少判真失败没人管、判不出来却开单 —— 三种都由它钉住"

[[gate]]
id = "contract-lib-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_lib -v"
reason = "scripts/lib/ 是四个发版脚本与 GitHub 常量的唯一实现(repo / version / docs / artifacts);它坏了四个脚本会一起静默走偏,而且没有第二份实现能对照"

[[gate]]
id = "contract-mail-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_mail -v"
reason = "发信内核是「告警能不能到人」的唯一通道,它坏掉的三种方式都不自己喊:主题格式漂了收件箱又变成每封一样、去重坏了要么每轮一封要么把真故障吞掉、失败被吞了巡检会以为自己报过而 systemd 全绿"

[[gate]]
id = "contract-observability-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest discover -s deploy/observability -p 'test_*.py' -v"
reason = "告警中转链路哑了没人会发现(告警本来就不常发),载荷渲染 / 去重键 / HTTP 入口都要有回归"

[[gate]]
id = "contract-openapi-web-stamp"
scope = "contract"
kind = "python"
command = "python scripts/gen_web_schema.py --check"
reason = "schema.d.ts 是 openapi.yml 的派生生成物,两者由不同栈重新生成:只跑 verify.sh backend 的改动(例如改视图 docstring,它会进 openapi 的 description)能让 openapi 与 HEAD 一致而 schema.d.ts 已过期,backend 轨全绿、只有 web 轨红(2026-11-16 PR #376 实测)。这道门禁比指纹、纯 Python 不需要 Node,所以能在 contract 组立刻红"

[[gate]]
id = "contract-openapi-web-stamp-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_gen_web_schema -v"
reason = "指纹判定器判错的两个方向都不能静默:漏报 = 改了契约不重生成仍然绿(本门禁存在的理由),误报 = CRLF/LF 让同一份契约算出两个哈希把 Windows 检出永远判红"

[[gate]]
id = "contract-pr-closes-selftest"
scope = "contract"
kind = "python"
command = "python -m unittest scripts.test_check_pr_closes -v"
reason = "PR 正文的 Closes #N 判定器判错的两个方向都不能静默:漏报 = 活干完了 issue 还开着(踩过两次:#102 悬一整轮、#466 写成 Refs),误报 = 声明了不关单却被判红、红线被当噪音关掉"

