# nginx 安全基线(HTTPS + 安全头 + 后台白名单)

> 用途：交友 App 切到 `https://chat.shiliu153.cn` 时使用。执行步骤、证书签发与回退见
> [2026-10-28-chat-shiliu153-cn-https.md](../superpowers/plans/2026-10-28-chat-shiliu153-cn-https.md)。
> 占位符：`<DOMAIN>` 正式域名、`<SERVER_IP>` 服务器公网 IP、`<OPS_ALLOWED_IP>` 你的办公/家庭出口 IP。
> 改完后：`nginx -t && nginx -s reload`，再按 `docs/security/2026-10-27-api-security-audit.md` 的验收项逐条验证。

## 1. HTTP 强制跳转 HTTPS

```nginx
server {
    listen 80;
    server_name <DOMAIN>;

    # 证书签发（certbot / 宝塔）需要保留 /.well-known/
    location /.well-known/acme-challenge/ { root /www/wwwroot/chatapp; }

    location / { return 301 https://$host$request_uri; }
}
```

## 2. HTTPS 站点与安全头

```nginx
server {
    listen 443 ssl http2;
    server_name <DOMAIN>;

    ssl_certificate     /www/server/panel/vhost/cert/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/<DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- 安全头（静态页与反代响应都生效）---
    # HSTS 一年：1 小时等于没有（用户 1 小时不访问就失效，可被 sslstrip 降级）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # connect-src 只留 wss：：HTTPS 页面下 ws: 本来就会被当混合内容拦掉
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    client_max_body_size 8m;

    # --- 后台只允许白名单 IP（没有白名单就不要对公网开放）---
    location /admin/ {
        allow <OPS_ALLOWED_IP>;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include /www/server/panel/vhost/nginx/proxy/<DOMAIN>.conf;
    }
    location /ops/ {
        allow <OPS_ALLOWED_IP>;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include /www/server/panel/vhost/nginx/proxy/<DOMAIN>.conf;
    }

    # --- API：只信任本机 nginx 追加的客户端 IP ---
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 覆盖客户端伪造值
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
        # Django SecurityMiddleware 也会加这几个头，会与 nginx 的重复下发；
        # 统一由 nginx 出口，把上游那份藏掉。
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # --- 自建 IM WebSocket ---
    location /im/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:9100;
    }

    location /im/api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:9101;
    }

    # --- 聊天媒体：先验签，再由 nginx 直出 ---
    location /media/chat/ {
        auth_request /_chat_media_auth;
        auth_request_set $auth_status $upstream_status;
        alias /www/wwwroot/chatapp/media/chat/;
    }
    location = /_chat_media_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/v1/im/images/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    # 资料图/广场图仍公开直出；至少加防盗链与限速
    location /media/ {
        valid_referers none blocked server_names <DOMAIN>;
        if ($invalid_referer) { return 403; }
        limit_rate 2m;
        alias /www/wwwroot/chatapp/media/;
    }

    # --- Web 静态资源 ---
    root /www/wwwroot/chatapp/web_dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
```

## 3. Django 侧开关

```dotenv
HTTPS_ENABLED=1
SECURE_HSTS_SECONDS=31536000
# 已确认无混合内容（构建产物里只有 http://localhost 与 http://www.w3.org 两个字符串常量）。
# 稳定运行数周、所有子域都确认走 HTTPS 后，可再开 SECURE_HSTS_PRELOAD=1 并提交 hstspreload.org。
CSRF_TRUSTED_ORIGINS=https://<DOMAIN>
NUM_PROXIES=1
```

验收：

```bash
curl -I http://<DOMAIN>            # 301 → https
curl -I https://<DOMAIN>           # HSTS=max-age=31536000；x-frame-options / csp 各只出现一次
curl -I https://<DOMAIN>/api/v1/app/config   # 同上，且头不重复（Django 那份被 proxy_hide_header 藏掉）
cd chatapp && python manage.py check --deploy   # 无 W004/W008/W012/W016
```

## 4. 证书到期巡检

`check_ssl_expiry.sh`（本目录）每天 08:00 由 root cron 跑一次，扫宝塔两个证书目录 + 线上实际下发的证书，
剩余天数 < 20 时写 `WARN` 到 `/var/log/ssl-expiry.log` 并以非零退出。

```bash
scp docs/ops/check_ssl_expiry.sh root@<SERVER_IP>:/root/
ssh root@<SERVER_IP> 'sed -i "s/\r$//" /root/check_ssl_expiry.sh && chmod 755 /root/check_ssl_expiry.sh'
ssh root@<SERVER_IP> '( crontab -l | grep -v check_ssl_expiry.sh; echo "0 8 * * * /root/check_ssl_expiry.sh" ) | crontab -'
```

为什么需要：certbot 只在剩余 < 30 天时续期，连续失败（ACME 限流 / webroot 权限 / 磁盘满）目前没有任何告警，
30 天后就是全站握手失败 + App 全体掉线。

## 5. 仍无法由 nginx 解决的部分

- Web 的 access/refresh token 仍在 `localStorage`：要彻底解决需改 BFF + HttpOnly Cookie（工作量较大，单独立项）。
- App 证书绑定已于 2026-10-28 落地（`app/lib/core/pinned_tls.dart`，固定 ISRG Root X1 + X2）。
  注意 Let's Encrypt 2026 年启用了新层级（叶子 ← YE1 ← Root YE ← X2 ← X1），当前链仍锚定在 X1/X2，
  `openssl verify -CAfile <x1+x2>` 实测通过；每次换证后建议跑一次 `dart run tool/verify_pinning.dart` 复核。
