# nginx 安全基线(HTTPS + 安全头 + 后台白名单)

> 用途：域名备案与证书到位后，按本文件替换宝塔站点配置里的对应片段。
> 占位符：`<DOMAIN>` 正式域名、`<SERVER_IP>` 服务器公网 IP、`<OPS_ALLOWED_IP>` 你的办公/家庭出口 IP。
> 改完后：`nginx -t && nginx -s reload`，再按 `docs/security/2026-10-27-api-security-audit.md` 的验收项逐条验证。

## 1. HTTP 强制跳转 HTTPS

```nginx
server {
    listen 80;
    server_name <DOMAIN>;

    # 证书签发（certbot / 宝塔）需要保留 /.well-known/
    location /.well-known/acme-challenge/ { root /www/wwwroot/chatapp; }

    location / { return 301 https://$host$request_uri; }
}
```

## 2. HTTPS 站点与安全头

```nginx
server {
    listen 443 ssl http2;
    server_name <DOMAIN>;

    ssl_certificate     /www/server/panel/vhost/cert/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/<DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- 安全头（静态页与反代响应都生效）---
    add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none';" always;

    client_max_body_size 8m;

    # --- 后台只允许白名单 IP（没有白名单就不要对公网开放）---
    location /admin/ {
        allow <OPS_ALLOWED_IP>;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include /www/server/panel/vhost/nginx/proxy/<DOMAIN>.conf;
    }
    location /ops/ {
        allow <OPS_ALLOWED_IP>;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include /www/server/panel/vhost/nginx/proxy/<DOMAIN>.conf;
    }

    # --- API：只信任本机 nginx 追加的客户端 IP ---
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 覆盖客户端伪造值
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    # --- 自建 IM WebSocket ---
    location /im/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:9100;
    }

    location /im/api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:9101;
    }

    # --- 聊天媒体：先验签，再由 nginx 直出 ---
    location /media/chat/ {
        auth_request /_chat_media_auth;
        auth_request_set $auth_status $upstream_status;
        alias /www/wwwroot/chatapp/media/chat/;
    }
    location = /_chat_media_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/v1/im/images/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    # 资料图/广场图仍公开直出；至少加防盗链与限速
    location /media/ {
        valid_referers none blocked server_names <DOMAIN>;
        if ($invalid_referer) { return 403; }
        limit_rate 2m;
        alias /www/wwwroot/chatapp/media/;
    }

    # --- Web 静态资源 ---
    root /www/wwwroot/chatapp/web_dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
```

## 3. Django 侧开关

```dotenv
HTTPS_ENABLED=1
SECURE_HSTS_SECONDS=3600
# 确认没有混合内容后再升到 31536000，并考虑 SECURE_HSTS_PRELOAD=1
CSRF_TRUSTED_ORIGINS=https://<DOMAIN>
NUM_PROXIES=1
```

验收：

```bash
curl -I http://<DOMAIN>            # 301 → https
curl -I https://<DOMAIN>           # 含 strict-transport-security / x-frame-options / content-security-policy
cd chatapp && python manage.py check --deploy   # 无 W004/W008/W012/W016
```

## 4. 仍无法由 nginx 解决的部分

- Web 的 access/refresh token 仍在 `localStorage`：要彻底解决需改 BFF + HttpOnly Cookie（工作量较大，单独立项）。
- App 未做证书绑定：需要引入 `flutter` 侧 pinning 插件并随版本发布。
