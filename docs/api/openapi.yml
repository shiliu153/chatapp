            request: DRF 请求对象,multipart 字段为 ``file``。

        Returns:
            201 + 照片对象;超出张数上限时返回 400。

        Raises:
            serializers.ValidationError: 图片缺失或超过大小上限。
            config.storage.StorageQuotaExceeded: 账号媒体存储配额已满(413/``41301``)。
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
          description: ''
  /api/v1/users/me/photos/{photo_id}:
    delete:
      operationId: users_me_photos_destroy
      description: |-
        删除自己的照片(DELETE /api/v1/users/me/photos/{photo_id})。

        只允许删除本人照片(查询集限定在 ``request.user.photos`` 上);
        删除后重算资料完善状态,照片不足会掉回「未完善」并失去候选资格。

        Args:
            request: DRF 请求对象。
            photo_id: 照片主键。

        Returns:
            204 空响应。
      parameters:
      - in: path
        name: photo_id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/me/preference:
    get:
      operationId: users_me_preference_retrieve
      description: |-
        我的择偶偏好:读取与局部更新(GET/PATCH /api/v1/users/me/preference)。

        Args:
            request: DRF 请求对象;``PATCH`` 支持部分字段。

        Returns:
            更新后的完整偏好对象。
      tags:
      - users
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preference'
          description: ''
    patch:
      operationId: users_me_preference_partial_update
      description: |-
        我的择偶偏好:读取与局部更新(GET/PATCH /api/v1/users/me/preference)。

        Args:
            request: DRF 请求对象;``PATCH`` 支持部分字段。

        Returns:
            更新后的完整偏好对象。
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPreferenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPreferenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPreferenceRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preference'
          description: ''
  /api/v1/users/tags:
    get:
      operationId: users_tags_list
      description: |-
        标签池全量列表(GET /api/v1/users/tags)。

        Args:
            request: DRF 请求对象。

        Returns:
            全部标签(12 个,由数据迁移写入);重封禁用户由全局权限类放行本接口。
      tags:
      - users
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - like
      - pass
      type: string
      description: |-
        * `like` - 喜欢
        * `pass` - 跳过
    AppConfig:
      type: object
      properties:
        min_app_version:
          type: string
        latest_version:
          type: string
        download_url:
          type: string
      required:
      - download_url
      - latest_version
      - min_app_version
    AuthorBrief:
      type: object
      properties:
        user_id:
          type: integer
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
      required:
      - avatar_url
      - nickname
      - user_id
    BlankEnum:
      enum:
      - ''
    Block:
      type: object
      description: 黑名单条目的对外表示,已内联对方的昵称与头像。
      properties:
        user_id:
          type: integer
          readOnly: true
        nickname:
          type: string
          description: |-
            取被拉黑方的昵称。

            Args:
                block: 拉黑记录。

            Returns:
                昵称;对方没有资料行时返回空串。
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          description: |-
            取被拉黑方第一张已过审照片的绝对 URL。

            Args:
                block: 拉黑记录。

            Returns:
                头像绝对 URL;没有已过审照片时返回 ``None``。
          readOnly: true
        blocked_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar_url
      - blocked_at
      - nickname
      - user_id
    BlockCreateRequest:
      type: object
      description: 拉黑入参。
      properties:
        target_user_id:
          type: integer
      required:
      - target_user_id
    BlockPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Block'
      required:
      - count
      - next
      - previous
      - results
    Candidate:
      type: object
      description: 候选卡片的对外表示。
      properties:
        user_id:
          type: integer
          readOnly: true
        nickname:
          type: string
          title: 昵称
          maxLength: 20
        gender:
          title: 性别
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        age:
          type: integer
          readOnly: true
        city:
          type: string
          title: 城市
          maxLength: 50
        bio:
          type: string
          title: 简介
          maxLength: 200
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          readOnly: true
      required:
      - age
      - photos
      - tags
      - user_id
    ChatImageUploadRequest:
      type: object
      description: 聊天图片上传入参(multipart 字段 ``file``)。
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    ChatImageUploaded:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        thumb_url:
          type: string
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
      required:
      - height
      - id
      - size
      - thumb_url
      - url
      - width
    ChatVoiceUploadRequest:
      type: object
      description: 聊天语音上传入参(multipart 字段 ``file`` + ``duration_ms``)。
      properties:
        file:
          type: string
          format: binary
        duration_ms:
          type: integer
          maximum: 60000
          minimum: 1000
      required:
      - duration_ms
      - file
    ChatVoiceUploaded:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        duration_ms:
          type: integer
        size:
          type: integer
      required:
      - duration_ms
      - id
      - size
      - url
    ClientErrorPlatformEnum:
      enum:
      - web
      - app
      type: string
      description: |-
        * `web` - web
        * `app` - app
    ClientErrorRequest:
      type: object
      description: |-
        一条客户端错误上报。

        Attributes:
            platform: 端标识,``web`` 或 ``app``。
            message: 错误摘要(必填)。
            stack: 堆栈文本,按 4KB 截断足够定位问题。
            route: 出错的页面/路由,便于按页面聚合。
            app_version: 客户端版本号。
            request_id: 客户端最后收到的 ``X-Request-Id``,用来和服务端日志对账。
      properties:
        platform:
          $ref: '#/components/schemas/ClientErrorPlatformEnum'
        message:
          type: string
          minLength: 1
          maxLength: 500
        stack:
          type: string
          default: ''
          maxLength: 8000
        route:
          type: string
          default: ''
          maxLength: 200
        app_version:
          type: string
          default: ''
          maxLength: 32
        request_id:
          type: string
          default: ''
          maxLength: 64
      required:
      - message
      - platform
    CommentPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/PostComment'
      required:
      - count
      - next
      - previous
      - results
    DevicePlatformEnum:
      enum:
      - android
      - ios
      type: string
      description: |-
        * `android` - Android
        * `ios` - iOS
    DeviceRequest:
      type: object
      description: 设备上报的入参。
      properties:
        registration_id:
          type: string
          minLength: 1
          maxLength: 128
        platform:
          $ref: '#/components/schemas/DevicePlatformEnum'
        app_version:
          type: string
          default: ''
          maxLength: 32
      required:
      - platform
      - registration_id
    DeviceResponse:
      type: object
      description: 设备上报的回执。
