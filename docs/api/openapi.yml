      description: |-
        * `pending` - 待审核
        * `approved` - 已通过
        * `rejected` - 已驳回
    PhotoUploadRequest:
      type: object
      description: 照片上传入参(multipart 字段 ``file``)。
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    Post:
      type: object
      description: 动态的对外表示,含作者、配图与互动计数。
      properties:
        id:
          type: integer
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/AuthorBrief'
          readOnly: true
        text:
          type: string
          title: 正文
          maxLength: 500
        images:
          type: array
          items:
            type: string
          readOnly: true
        like_count:
          type: integer
          readOnly: true
          default: 0
        comment_count:
          type: integer
          readOnly: true
          default: 0
        liked_by_me:
          type: boolean
          readOnly: true
          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - comment_count
      - created_at
      - id
      - images
      - like_count
      - liked_by_me
    PostComment:
      type: object
      description: |-
        评论的对外表示:作者摘要、被回复者、回复数与内嵌前两条回复。

        回复不再递归:回复对象的 ``replies`` 恒为空、``reply_count`` 恒为 0,
        避免响应随层级膨胀。
      properties:
        id:
          type: integer
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/AuthorBrief'
          readOnly: true
        text:
          type: string
          title: 内容
          maxLength: 200
        parent_id:
          type: integer
          readOnly: true
          nullable: true
        reply_to:
          allOf:
          - $ref: '#/components/schemas/ReplyTo'
          readOnly: true
        reply_count:
          type: integer
          description: |-
            取该楼层可见回复的总数(回复对象恒为 0)。

            Args:
                comment: 评论对象。

            Returns:
                可见回复条数。
          readOnly: true
        replies:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - parent_id
      - replies
      - reply_count
      - reply_to
      - text
    PostCommentCreateRequest:
      type: object
      description: 发表评论的入参;``parent_id`` 非空表示这是一条回复。
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
        parent_id:
          type: integer
          minimum: 1
          nullable: true
      required:
      - text
    PostCreateBodyRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        images:
          type: array
          items:
            type: string
            format: binary
    PostLikeResult:
      type: object
      properties:
        liked:
          type: boolean
      required:
      - liked
    PostPage:
      type: object
      properties:
        count:
          type: integer
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/Post'
      required:
      - count
      - has_more
      - next_cursor
      - results
    PostReportCreateRequest:
      type: object
      description: 举报动态的入参。
      properties:
        type:
          $ref: '#/components/schemas/ReportTypeEnum'
        detail:
          type: string
          default: ''
          maxLength: 200
      required:
      - type
    PostReportResult:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
      required:
      - id
      - status
    Preference:
      type: object
      description: 择偶偏好的读写表示。
      properties:
        target_gender:
          nullable: true
          title: 想找的性别
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        age_min:
          type: integer
          maximum: 65535
          minimum: 0
          title: 最小年龄
        age_max:
          type: integer
          maximum: 65535
          minimum: 0
          title: 最大年龄
        city:
          type: string
          title: 城市
          maxLength: 50
    PresenceItem:
      type: object
      properties:
        user_id:
          type: integer
        online:
          type: boolean
        last_active_at:
          type: string
          format: date-time
          nullable: true
      required:
      - last_active_at
      - online
      - user_id
    PresenceResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PresenceItem'
      required:
      - results
    Profile:
      type: object
      description: 「我的资料」的完整表示,含隐私字段与完善度提示。
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
        nickname:
          type: string
          title: 昵称
          maxLength: 20
        gender:
          title: 性别
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        birthday:
          type: string
          format: date
          nullable: true
          title: 生日
        age:
          type: integer
          readOnly: true
        city:
          type: string
          title: 城市
          maxLength: 50
        bio:
          type: string
          title: 简介
          maxLength: 200
        status:
          allOf:
          - $ref: '#/components/schemas/ProfileStatusEnum'
          title: 状态
        ban_reason:
          type: string
          title: 封禁原因
          maxLength: 200
        missing_fields:
          type: array
          items:
            type: string
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          readOnly: true
        preference:
          allOf:
          - $ref: '#/components/schemas/Preference'
          readOnly: true
        visits_hidden:
          type: boolean
          title: 隐身浏览
      required:
      - age
      - id
      - missing_fields
      - phone
      - photos
      - preference
      - tags
      - user_id
    ProfileStatusEnum:
      enum:
      - incomplete
      - complete
      - banned_light
      - banned_heavy
      type: string
      description: |-
        * `incomplete` - 未完善
        * `complete` - 已完善
        * `banned_light` - 轻度封禁
        * `banned_heavy` - 重度封禁
    PublicProfile:
      type: object
      description: 对方资料卡:只比 ProfileSerializer 少了隐私字段(手机号/生日/偏好/缺项)。
      properties:
        user_id:
          type: integer
          readOnly: true
        nickname:
          type: string
          title: 昵称
          maxLength: 20
        gender:
          title: 性别
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        age:
          type: integer
          readOnly: true
        city:
          type: string
          title: 城市
          maxLength: 50
        bio:
          type: string
          title: 简介
          maxLength: 200
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          readOnly: true
      required:
      - age
      - photos
      - tags
      - user_id
    PushPreference:
      type: object
      description: 通知偏好的读写形状(四个布尔字段,对应四类通知)。
      properties:
        likes:
          type: boolean
          title: 新的喜欢
        matches:
          type: boolean
          title: 配对成功
        messages:
          type: boolean
          title: 新消息
        system:
          type: boolean
          title: 系统通知
    ReadyStatus:
      type: object
      properties:
        status:
          type: string
        checks:
          type: object
          additionalProperties: {}
      required:
      - checks
      - status
    ReplyPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/PostComment'
      required:
      - count
      - next
      - previous
      - results
    ReplyTo:
      type: object
      properties:
        user_id:
          type: integer
        nickname:
          type: string
      required:
      - nickname
      - user_id
    Report:
      type: object
      description: 举报的对外表示(只回执最必要的三项)。
      properties:
        id:
          type: integer
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/ReportTypeEnum'
          title: 类型
        status:
          allOf:
          - $ref: '#/components/schemas/ReportStatusEnum'
          title: 状态
      required:
      - id
      - type
    ReportCreateRequest:
      type: object
      description: 举报入参。
      properties:
        target_user_id:
          type: integer
        type:
          $ref: '#/components/schemas/ReportTypeEnum'
        detail:
          type: string
          default: ''
          maxLength: 200
      required:
      - target_user_id
      - type
    ReportStatusEnum:
      enum:
      - pending
      - handled
      type: string
      description: |-
        * `pending` - 待处理
        * `handled` - 已处理
    ReportTypeEnum:
      enum:
      - harassment
      - porn
      - fraud
      - other
      type: string
      description: |-
        * `harassment` - 骚扰
        * `porn` - 色情
        * `fraud` - 诈骗
        * `other` - 其他
    SmsSendStatus:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    SmsVerifyRequest:
      type: object
      description: 手机号 + 6 位验证码的入参。
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
        code:
          type: string
          minLength: 6
          maxLength: 6
      required:
      - code
      - phone
    SmsVerifyResult:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        is_new_user:
          type: boolean
        user_id:
          type: integer
      required:
      - access
      - is_new_user
      - user_id
    SwipeRequest:
      type: object
      description: 滑卡入参:目标用户与动作。
      properties:
        target_user_id:
          type: integer
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
      - target_user_id
    SwipeResult:
      type: object
      properties:
        matched:
          type: boolean
      required:
      - matched
    Tag:
      type: object
      description: 标签的对外表示。
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: 名称
          maxLength: 20
        icon:
          type: string
          title: 图标
          maxLength: 50
      required:
      - id
      - name
    TokenRefreshBodyRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
    TokenRefreshResult:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
    Visit:
      type: object
      description: 「谁看过我」列表项:对方公开资料 + 最近访问时间。
      properties:
        user_id:
          type: integer
          readOnly: true
        im_user_id:
          type: string
          readOnly: true
        nickname:
          type: string
          readOnly: true
        gender:
          type: string
          readOnly: true
        age:
          type: integer
          readOnly: true
          nullable: true
        city:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          readOnly: true
        visited_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - age
      - bio
      - city
      - gender
      - im_user_id
      - nickname
      - photos
      - tags
      - user_id
      - visited_at
    VisitPage:
      type: object
      properties:
        count:
          type: integer
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/Visit'
      required:
      - count
      - has_more
      - next_cursor
      - results
    VisitsCount:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
