          type: string
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        matched_at:
          type: string
          format: date-time
      required:
      - avatar_url
      - im_user_id
      - matched_at
      - nickname
      - user_id
    MatchPage:
      type: object
      properties:
        count:
          type: integer
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/MatchEntry'
      required:
      - count
      - has_more
      - next_cursor
      - results
    MyPostPage:
      type: object
      properties:
        count:
          type: integer
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/Post'
      required:
      - count
      - has_more
      - next_cursor
      - results
    NullEnum:
      enum:
      - null
    PatchedPreferenceRequest:
      type: object
      description: 择偶偏好的读写表示。
      properties:
        target_gender:
          nullable: true
          title: 想找的性别
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        age_min:
          type: integer
          maximum: 65535
          minimum: 0
          title: 最小年龄
        age_max:
          type: integer
          maximum: 65535
          minimum: 0
          title: 最大年龄
        city:
          type: string
          title: 城市
          maxLength: 50
    PatchedProfileUpdateRequest:
      type: object
      description: 编辑资料的入参;所有字段可选,只校验提交上来的那些。
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        gender:
          $ref: '#/components/schemas/GenderEnum'
        birthday:
          type: string
          format: date
        city:
          type: string
          minLength: 1
          maxLength: 50
        bio:
          type: string
          minLength: 1
          maxLength: 200
        tag_ids:
          type: array
          items:
            type: integer
        visits_hidden:
          type: boolean
    PatchedPushPreferenceRequest:
      type: object
      description: 通知偏好的读写形状(四个布尔字段,对应四类通知)。
      properties:
        likes:
          type: boolean
          title: 新的喜欢
        matches:
          type: boolean
          title: 配对成功
        messages:
          type: boolean
          title: 新消息
        system:
          type: boolean
          title: 系统通知
    PhoneRequest:
      type: object
      description: 只接收一个手机号的入参。
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - phone
    Photo:
      type: object
      description: 照片的对外表示:只暴露 URL 与审核状态,不暴露存储路径。
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PhotoStatusEnum'
          title: 审核状态
        order:
          type: integer
          maximum: 65535
          minimum: 0
          title: 排序
