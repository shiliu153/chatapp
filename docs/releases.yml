# 发版记录 —— **唯一事实来源**(治理方案第 5 节 / C8 / D1-B 拍板)
#
# 为什么是 YAML 而不是 release.md §5 的 Markdown 表格
# ---------------------------------------------------
# 以前门禁(sync_version.py --check)靠「表头同时含『版本』与『tag』」去猜那张表,
# 改一次表格格式就可能误红;而历史里还有 4 行是散文(「—」/「无(规则生效前发版)」/
# 「历史遗留:…」),结构化解析与人的阅读体验被硬绑在一起。现在反过来:
#   - 本文件 = owner,逐字段、可机械解析(scripts/lib/docs.py);
#   - docs/ops/release.md §5 的表格 = **渲染物**(`<!-- BEGIN generated:release-records -->`
#     与 `<!-- END generated:release-records -->` 之间),**禁止手改**;
#   - 门禁:`python scripts/releases.py --check`(渲染物 == 本文件)+
#     `python scripts/sync_version.py --check`(当前版本必须有留痕)。
#
# 怎么加一条(发版清单步骤 7)
# ---------------------------
# 1. 在文件末尾追加一条记录(字段见下);
# 2. 跑 `python scripts/releases.py --render` 把 §5 的表格重新渲染;
# 3. 跑 `python scripts/sync_version.py --check` 确认退出码 0。
#
# 字段
# ----
# version      版本名,如 1.0.13(必需)
# date         发版日期 YYYY-MM-DD(必需)
# tag          tag 名,如 v1.0.13;发版规则生效前留空(渲染成「—」)
# title        Release 标题,如 "v1.0.13 — R–W 六批…"(渲染成链接文字)
# release      Release 链接;**散文行留空**
# note         Release 列的散文(历史遗留 / 规则生效前发版);release 非空时不渲染
# asset        附件名,如 chatapp-1.0.13.apk(渲染成反引号)
# asset_bytes  附件字节数(整数;未知写 0,渲染成 61,505,970 字节)
# asset_sha1   附件 SHA-1(未知留空)
# deploy_sha   上线 SHA(短 SHA 即可;未知留空,渲染成「—」)
#
# 只支持这个 YAML 子集:扁平记录列表、双引号字符串 / 整数 / null、整行 # 注释。
# 字段名拼错会直接报错(不会静默丢一列),见 scripts/lib/docs.py。

