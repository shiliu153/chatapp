# 后端依赖锁定文件(L6,2026-10-28)
#
# 为什么:requirements.txt 只写区间,`pip install` 每次可能装到不同版本,
#   线上出问题无法复现,也看不出供应链有没有被换过。生产与 CI 一律装本文件。
#
# 安装:pip install -r requirements.lock
#
# 生成方式:在通过全量测试的环境里,从 requirements.txt 的直接依赖出发,
#   用 importlib.metadata 递归解析依赖闭包(标记按 CPython 3.10 / Linux 求值),
#   输出精确版本。升级流程:
#     1. 改 requirements.txt 的区间(只在那里表达"允许的范围");
#     2. 在干净虚拟环境 pip install -r requirements.txt;
#     3. 重新生成 requirements.lock(脚本见 docs/pitfalls/backend.md);
#     4. 跑全量测试 + 手工回归,再提交。
#
# 注意:本文件含 celery 在 Python < 3.11 下的条件依赖(async-timeout/exceptiongroup),
#   在 3.11+ 上安装无害;换 Python 大版本后必须重新生成。
#
# 守卫:config/tests.py::DependencyLockTests 会比对 requirements.txt 的直接依赖,
#   新增依赖却忘了更新本文件时测试直接红。

