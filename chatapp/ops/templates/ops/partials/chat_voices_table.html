<table id="chat-voices-table">
  <thead>
    <tr><th>试听</th><th>发送者</th><th>时长</th><th>时间</th><th>大小(字节)</th><th>操作</th></tr>
  </thead>
  <tbody>
  {% for voice in voices %}
    <tr>
      <td>
        <audio controls preload="none" src="{{ voice.signed_file_url }}"></audio>
      </td>
      <td>{{ voice.owner_id }}</td>
      <td>{{ voice.duration_seconds }} 秒</td>
      <td>{{ voice.created_at|date:"Y-m-d H:i" }}</td>
      <td>{{ voice.bytes }}</td>
      <td>
        <form hx-post="{% url 'ops:chat_voice_delete' voice.id %}"
              hx-target="#chat-voices-table" hx-swap="outerHTML">
          <button type="submit" class="danger">删除</button>
        </form>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="6">暂无聊天语音</td></tr>
  {% endfor %}
  </tbody>
</table>
