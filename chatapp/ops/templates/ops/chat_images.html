{% extends "ops/base.html" %}
{% block page_title %}聊天图片{% endblock %}
{% block content %}
<p class="ops-tabs">
  <a href="{% url 'ops:chat_images' %}" class="{% if not reported %}active{% endif %}">全部</a>
  <a href="{% url 'ops:chat_images' %}?reported=1" class="{% if reported %}active{% endif %}">仅被举报</a>
</p>
<p><small>按时间倒序展示最近 120 张正常状态的聊天图片;删除后聊天里显示占位图。

{% endblock %}
