{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二次验证 · 运营审核台</title>
  <link rel="stylesheet" href="{% static 'ops/ops.css' %}">
</head>
<body class="login-body">
<div class="login-card">
  <h1>二次验证</h1>
  {% if setup %}
    <p>首次使用请在验证器 App(如 Google Authenticator)中添加以下密钥:</p>
    <p><code>{{ secret }}</code></p>
    <p class="ops-muted">或手动输入地址:<br><code>{{ uri }}</code></p>
  {% endif %}
  {% if error %}<p class="ops-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>6 位验证码<input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus maxlength="6"></label>
    <button type="submit">{% if setup %}确认绑定{% else %}验证{% endif %}</button>
  </form>
</div>
</body>
</html>
