# EDGE 节点 nginx：API 双副本 + IM 单节点 + 媒体写路径钉本机。
#
# 相对 deploy/nginx/http.conf.tmpl 的差别只有三处（其余保持一致，便于比对）：
#   ① /api 走 upstream chatapp_api（least_conn 双副本），不用 ip_hash；
#   ② 上传/落媒体的接口**钉到本机** web:8000 —— 媒体卷只在 EDGE（设计稿 §5）；
#   ③ /media/ 仍直出本机卷。
#
# 第二个副本通过 SSH 隧道暴露在宿主 172.28.0.1:18000（安全组放行内网端口后
# 改成对端内网 IP 即可，其余不动）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream chatapp_api {
    least_conn;
    server web:8000            max_fails=3 fail_timeout=10s;
    server 172.28.0.1:18000    max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /static/ {
        alias /srv/static/;
        expires 7d;
    }

    location ^~ /media/chat/ {
        auth_request /_im_media_auth;
        alias /srv/media/chat/;
        expires 1h;
    }

    location = /_im_media_auth {
        internal;
        proxy_pass http://web:8000/api/v1/im/images/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # ③ 写媒体的接口钉到本机副本：媒体卷只在 EDGE，落到 APP 副本就读不回来。
    location ~ ^/api/v1/(im/images|im/voices|users/me/photos)$ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /im/ws {
        # IM 多实例要等 #288 合并；现在只有 EDGE 这一个 imserver。
        proxy_pass http://imserver:9100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /im/api/ {
        proxy_pass http://imserver:9101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ① API / admin / ops 走双副本
    location ~ ^/(api|admin|ops)(/|$) {
        proxy_pass http://chatapp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
