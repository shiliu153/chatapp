# EDGE 节点 nginx：API 双副本 + IM 两节点簇 + 媒体写路径钉本机。
#
# 相对 deploy/nginx/http.conf.tmpl 的差别（其余保持一致，便于比对）：
#   ① /api 走 upstream chatapp_api（least_conn 双副本），不用 ip_hash；
#   ② /im/ws 与 /im/api/ 走 upstream 双节点（跨节点投递由 imserver 内部的 Redis pub/sub 完成）；
#   ③ 上传/落媒体的接口**钉到本机** web:8000 —— 媒体卷只在 EDGE（设计稿 §5）；
#   ④ /media/ 仍直出本机卷。
#
# 第二个副本的地址是**应用机内网 IP**（2026-11-13 起直连；此前是 SSH 隧道
# 172.28.0.1:18000 之类，安全组放行后已切换）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream chatapp_api {
    least_conn;
    server web:8000            max_fails=3 fail_timeout=10s;
    server 172.31.35.181:8000    max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# IM 两节点簇(#288):会话归属由 Redis owner 键决定,客户端连任意节点都能收到消息,
# 所以这里**不需要** sticky / ip_hash(移动端 CGNAT 会把整个运营商出口压到一台)。
upstream chatapp_im_ws {
    least_conn;
    server imserver:9100        max_fails=3 fail_timeout=10s;
    server 172.31.35.181:9100     max_fails=3 fail_timeout=10s;
}

upstream chatapp_im_http {
    least_conn;
    server imserver:9101        max_fails=3 fail_timeout=10s;
    server 172.31.35.181:9101     max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /static/ {
        alias /srv/static/;
        expires 7d;
    }

    location ^~ /media/chat/ {
        auth_request /_im_media_auth;
        alias /srv/media/chat/;
        expires 1h;
    }

    location = /_im_media_auth {
        internal;
        proxy_pass http://web:8000/api/v1/im/images/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # ③ 写媒体的接口钉到本机副本：媒体卷只在 EDGE，落到 APP 副本就读不回来。
    location ~ ^/api/v1/(im/images|im/voices|users/me/photos)$ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ④ 广场动态会落图(PostImage.file → media/posts/%Y/%m/),而媒体卷只在 EDGE。
    #    整条 /posts 系列(读+写)都钉本机 —— 宁可放弃这条 path 的横向扩展,
    #    也不能出现「带图动态的图片 404」这种更难排查的问题。
    #    影响面可接受:广场写入量远低于滑卡/聊天。
    location ~ ^/api/v1/posts(/|$) {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location /im/ws {
        # 两节点簇(EDGE + APP),跨节点投递由 imserver 内部的 Redis pub/sub 完成。
        proxy_pass http://chatapp_im_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /im/api/ {
        proxy_pass http://chatapp_im_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ① API / admin / ops 走双副本
    location ~ ^/(api|admin|ops)(/|$) {
        proxy_pass http://chatapp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}

