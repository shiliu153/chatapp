# APP 节点（32.236.245.150）的副本：Django + imserver 各一份。
#
# 数据层与 IM 内部接口暂经 SSH 隧道回源 EDGE（安全组未放行内网业务端口）；
# 隧道换成内网直连后这套配置不用改结构，只改 secrets 里的地址。
name: chatapp-app

x-guard: &guard
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  web:
    <<: *guard
    image: chatapp-web:local
    env_file:
      - "./secrets/chatapp.app.env"
    command: ["gunicorn", "config.wsgi:application", "-b", "0.0.0.0:8000",
              "-w", "2", "--timeout", "120", "--access-logfile", "-"]
    # 只绑回环：EDGE 的 nginx 经 SSH 隧道（EDGE:18000 -> APP:18080）过来。
    # 用 18080 而不是 8000：APP 上 `chaoxing-web` 已占着 127.0.0.1:8000
    # （2026-11-13 实测撞车，见 p2-dual-node.md §7）。
    ports:
      - "127.0.0.1:18080:8000"
    # APP 节点上已有 chaoxing-web 占用 ~760MB，本副本不能超过 400m
    mem_limit: 400m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - chatapp_app_static:/app/staticfiles
      - chatapp_app_media:/app/media

  # 本机的 imserver 实例（#288）：与 EDGE 的 imserver 组成两节点集群，
  # 会话归属由 Redis owner 键决定，消息跨节点经 pub/sub 投递。
  imserver:
    <<: *guard
    image: chatapp-imserver:local
    env_file:
      - "./secrets/imserver.app.env"
    # 只绑回环：EDGE 的 nginx 经 SSH 隧道过来；数据层经隧道回源 EDGE 的 MySQL/Redis。
    ports:
      - "127.0.0.1:9100:9100"
      - "127.0.0.1:9101:9101"
    mem_limit: 256m
    healthcheck:
      # 镜像里没有 curl，用容器内的 bash 探端口（与 EDGE 侧同一套绕法）。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9101' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  # 这两个卷在 APP 上只是「占位」：媒体真正的落盘处只在 EDGE（见设计稿 §5），
  # APP 侧写进来的东西不会有副本读到 —— 这也是为什么上传类接口在 nginx 里被钉死到 EDGE。
  chatapp_app_static:
    name: chatapp_app_static
  chatapp_app_media:
    name: chatapp_app_media
