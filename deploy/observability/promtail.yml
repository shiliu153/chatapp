# Promtail:把本机日志文件推进 Loki。
# 两个来源:宝塔站点日志(/www/wwwlogs)与 supervisor 托管的 gunicorn/celery 输出。
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: chatapp-files
    static_configs:
      # 宝塔站点日志 + Django 自己的 LOG_FILE
      - targets: [localhost]
        labels:
          job: chatapp
          host: chatapp-prod
          source: wwwlogs
        __path__: /www/wwwlogs/*.log
      # gunicorn / celery 的 stdout/stderr(supervisor 托管)
      - targets: [localhost]
        labels:
          job: chatapp
          host: chatapp-prod
          source: supervisor
        __path__: /www/server/panel/plugin/supervisor/log/*.log
