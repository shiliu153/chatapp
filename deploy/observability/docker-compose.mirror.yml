# 国内服务器拉不到 Docker Hub 时,用镜像站覆盖 image。
# 用法(服务器上):
#   cp docker-compose.mirror.yml docker-compose.override.yml
#   docker compose up -d
# 镜像站不可用时删掉 override 即可回到官方源。
#
# 2026-11-05:celery-exporter 改为 PyPI 包 + systemd 服务(不在国内镜像站白名单),
# 因此这里没有它的镜像条目 —— 写进来会凭空多出一个容器,别加。
#
# 镜像同样钉 digest(第五轮 L-3):镜像站是纯代理,同一 tag 的 digest 与上游一致;
# 改 docker-compose.yml 里的版本时这里要一起改,否则 override 会把钉住的引用盖回裸 tag。
services:
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
  alertmanager:
    image: docker.m.daocloud.io/prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
  grafana:
    image: docker.m.daocloud.io/grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
  node-exporter:
    image: docker.m.daocloud.io/prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
  mysqld-exporter:
    image: docker.m.daocloud.io/prom/mysqld-exporter:v0.15.1@sha256:7211a617ec657701ca819aa0ba28e1d5750f5bf2c1391b755cc4a48cc360b0fa
  redis-exporter:
    image: docker.m.daocloud.io/oliver006/redis_exporter:v1.62.0@sha256:c5a968ba5f30bab5e12181cceb89c4ed37cb4fe4d85490b5b66c7cfe4750b5e8
  loki:
    image: docker.m.daocloud.io/grafana/loki:3.2.0@sha256:882e30c20683a48a8b7ca123e6c19988980b4bd13d2ff221dfcbef0fdc631694
  promtail:
