services:
  # 2C2G 上的最小观测栈:Prometheus + Alertmanager + Grafana + node_exporter。
  # 全部 host 网络,直接抓 127.0.0.1 上的 gunicorn:8000 与 imserver:9101,
  # 不经过 nginx(所以 /metrics 在 nginx 上被 404 掉也不影响抓取)。
  prometheus:
    image: prom/prometheus:v2.55.1
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    mem_limit: 160m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    mem_limit: 32m

  # Alertmanager 的 JSON 与企业微信机器人格式不同,用 40 行的中转脚本转换。
  alert-relay:
    image: python:3.12-alpine
    network_mode: host
    restart: unless-stopped
    command: ["python", "/app/alert_relay.py"]
    environment:
      WECOM_WEBHOOK: ${WECOM_WEBHOOK:-}
      LISTEN_PORT: "9099"
    volumes:
      - ./alert_relay.py:/app/alert_relay.py:ro
    mem_limit: 32m

  grafana:
    image: grafana/grafana:11.3.1
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 96m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    network_mode: host
    restart: unless-stopped
    # 9100 被 imserver WS 占用,换 9105。
    command: ["--web.listen-address=127.0.0.1:9105"]
    mem_limit: 24m

  # --- 日志(可选):docker compose --profile logs up -d ---
  loki:
    image: grafana/loki:3.2.0
    profiles: ["logs"]
    network_mode: host
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    mem_limit: 128m

  promtail:
    image: grafana/promtail:3.2.0
    profiles: ["logs"]
    network_mode: host
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /www/wwwlogs:/www/wwwlogs:ro
      - /www/server/panel/plugin/supervisor/log:/www/server/panel/plugin/supervisor/log:ro
    depends_on:
      - loki
    mem_limit: 48m

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
