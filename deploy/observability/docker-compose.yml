# 镜像一律钉「版本 tag + 多架构 index digest」(第五轮 L-3;门禁 scripts/check_image_pins.py)。
# 升级:docker buildx imagetools inspect <tag> 取 Digest: 那一行,同时改本文件与
# docker-compose.mirror.yml(镜像站对同一 tag 的 digest 与上游一致,2026-11-16 实测)。
services:
  # 2C2G 上的最小观测栈:Prometheus + Alertmanager + Grafana + node_exporter
  # + 两个容器 exporter(mysqld / redis;celery-exporter 走 systemd,理由见下)。
  # 全部 host 网络,直接抓 127.0.0.1 上的 gunicorn:8000 与 imserver:9101,
  # 不经过 nginx(所以 /metrics 在 nginx 上被 404 掉也不影响抓取)。
  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    mem_limit: 160m

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    mem_limit: 32m

  # 告警转发(Alertmanager JSON → 邮件)不再跑在容器里:它要调宿主机上的
  # /opt/notify(与每天 22:00 服务器日报同一条发信链路)并读写 notify 的状态库,
  # 挂四处目录进容器不如直接跑在宿主机上。见 deploy/observability/alert-relay.service。
  # 部署:systemctl enable --now chatapp-alert-relay

  grafana:
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 96m

  node-exporter:
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    network_mode: host
    restart: unless-stopped
    # 9100 被 imserver WS 占用,换 9105。
    command: ["--web.listen-address=127.0.0.1:9105"]
    mem_limit: 24m

  # --- 两个 exporter:把「DB / Redis 的容量读数」接进同一条抓取链 ---
  #
  # Celery 的 exporter **不在这里**:danihodovic/celery-exporter 不在国内镜像站白名单
  # (daocloud 直接拒),直连 Docker Hub 在这台机器上只有 ~18KB/s。改成 PyPI 包 +
  # systemd 服务(chatapp-celery-exporter),见 celery-exporter.service 与 celery_exporter_run.py。
  # Celery 任务级指标还依赖 Django 的 CELERY_WORKER_SEND_TASK_EVENTS=True 与 worker 重启。

  # MySQL:用应用账号(只读不了 processlist/复制状态,所以关掉那两个 collector),
  # 口令文件只读挂载、在服务器上生成(见 docs/ops/observability.md §2 的部署步骤)。
  # 抓不到 mysql_up=1 就是账号/口令/文件权限不对 —— 先看 docker logs 里的 "Error parsing host config"。
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1@sha256:7211a617ec657701ca819aa0ba28e1d5750f5bf2c1391b755cc4a48cc360b0fa
    network_mode: host
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/mysqld_exporter/my.cnf
      - --web.listen-address=127.0.0.1:9104
      # 应用账号没有 PROCESS / REPLICATION CLIENT,这两个 scraper 只会刷访问被拒的日志。
      - --no-collect.slave_status
      - --no-collect.info_schema.processlist
    volumes:
      - ./mysqld_exporter.cnf:/etc/mysqld_exporter/my.cnf:ro
    mem_limit: 32m

  # Redis:连接数 / 内存 / 命中率;命令统计的 key 基数可控(--check-keys 只列指定键)。
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0@sha256:c5a968ba5f30bab5e12181cceb89c4ed37cb4fe4d85490b5b66c7cfe4750b5e8
    network_mode: host
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://127.0.0.1:6379
      REDIS_EXPORTER_LOG_FORMAT: txt
    command: ["--web.listen-address=127.0.0.1:9121"]
    mem_limit: 32m

  # --- 日志(可选):docker compose --profile logs up -d ---
  loki:
    image: grafana/loki:3.2.0@sha256:882e30c20683a48a8b7ca123e6c19988980b4bd13d2ff221dfcbef0fdc631694
    profiles: ["logs"]
    network_mode: host
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    mem_limit: 128m

  promtail:
    image: grafana/promtail:3.2.0@sha256:a77ce6cc7d6f1a05611adeaef863935f66d68640d9d0ef2feb190c8f0edac19e
    profiles: ["logs"]
    network_mode: host
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /www/wwwlogs:/www/wwwlogs:ro
      - /www/server/panel/plugin/supervisor/log:/www/server/panel/plugin/supervisor/log:ro
    depends_on:
      - loki
    mem_limit: 48m

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
