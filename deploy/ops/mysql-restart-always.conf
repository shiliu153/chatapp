[Service]
# 2026-11-01 压测 P0-2:现网 mysqld 的 systemd unit 是 sysv 生成的,Restart=no,
# 双杀 mysqld + mysqld_safe 后永久宕机。装了真正的 mysqld.service 时用 drop-in 补上:
#   mkdir -p /etc/systemd/system/mysqld.service.d
#   cp mysql-restart-always.conf /etc/systemd/system/mysqld.service.d/
#   systemctl daemon-reload
# 宝塔/mysqld_safe 形态没有可用的 unit,改用 mysql-watchdog.sh(每分钟 cron)。
Restart=always
RestartSec=5
