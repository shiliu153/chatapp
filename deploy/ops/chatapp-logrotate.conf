# /etc/logrotate.d/chatapp —— 应用日志轮转
#
# 背景(2026-11-04 D-2 实测):`LOG_FILE=/www/wwwlogs/chatapp/app.log`,每个请求一行 JSON
# (MetricsMiddleware),此前**没有任何轮转**;持续高压约 1.4MB / 5 分钟(450 rps 量级),
# 30 分钟约 40MB,长期高压会把磁盘写满。
#
# 安装(服务器上):
#   cp deploy/ops/chatapp-logrotate.conf /etc/logrotate.d/chatapp
#   chmod 644 /etc/logrotate.d/chatapp
#   logrotate -d /etc/logrotate.d/chatapp     # 干跑,确认匹配到文件
#
# 为什么用 copytruncate:gunicorn / celery 用 Python FileHandler 把日志文件**打开着**,
# 只 rename 不重开的话进程会继续写旧 inode(日志看起来「停了」)。
# copytruncate 复制后原地截断,进程无需重开文件;代价是复制与截断之间的几毫秒可能丢几行,
# 对访问日志可接受。
/www/wwwlogs/chatapp/*.log {
    daily
    rotate 14
    maxsize 200M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
    su root root
}
