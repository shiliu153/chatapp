# 聊天图片签名 URL 的 nginx 片段(2026-10-26)
#
# 粘贴到站点 server{} 块内,**必须放在 `location ^~ /media/` 之前**
# (nginx 的 ^~ 前缀匹配按最长前缀优先,但同一前缀只能有一个 location,
#  所以这里用 /media/chat/ 单独接管聊天图片)。
#
# 生产 nginx 没有编译 secure_link 模块(实测只有 --with-http_auth_request_module),
# 因此用 auth_request 把每次请求的签名交给 Django 校验。
#
# 依赖 Django 的 GET /api/v1/im/images/auth(读 X-Original-URI,204 放行 / 403 拒绝)。

location ^~ /media/chat/ {
    auth_request /_im_media_auth;
    alias /www/wwwroot/chatapp/chatapp/media/;
    # 签名 URL 每小时稳定、24 小时有效;缓存 1 小时不会拿到过期链接
    expires 1h;
    add_header Cache-Control "private, max-age=3600";
}

location = /_im_media_auth {
    internal;
    proxy_pass http://127.0.0.1:8000/api/v1/im/images/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
