services:
  mysql:
    # L-3:与 deploy/docker-compose.yml.tmpl 的生产版本同一个 digest —— 测试跑在
    # 与生产同一个小版本的 MySQL 上,迁移/索引行为才可比
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chatapp_im
      MYSQL_USER: imserver
      MYSQL_PASSWORD: imserver
    expose: ["3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      retries: 20
  redis:
    # L-3:同上,与生产同一个 redis 版本
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/src
      - ..:/repo
    working_dir: /src
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      IM_MYSQL_DSN: mysql://imserver:imserver@mysql:3306/chatapp_im
      IM_REDIS_URL: redis://redis:6379/2
      IM_JWT_SECRET: test-jwt-secret-0123456789abcdef
      IM_INTERNAL_SECRET: test-internal-secret
      IM_MIGRATIONS_DIR: /src/migrations
      IM_MEDIA_PREFIX: http://cdn/media/chat/
      # 批次 Q:集成测试用专用词表(不含镜像里那份真词表),见 tests/fixtures/sensitive_words_test.txt
      IM_SENSITIVE_WORDS_FILE: /src/tests/fixtures/sensitive_words_test.txt
      IM_MEDIA_SIGN_SECRET: test-media-secret
      IM_MEDIA_SIGN_TTL: "86400"
    command: bash /src/scripts/test_integration.sh
